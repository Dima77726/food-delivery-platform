# Значения переменных окружения для тестов каталога. Настоящие адреса и пароли контейнеров
# подставляет @ServiceConnection и перекрывает значения ниже: плейсхолдеры в application.yml
# обязаны разрешаться ещё до того, как поднимутся контейнеры.
CATALOG_DB_USER=test
CATALOG_DB_PASSWORD=test

# gRPC-сервер на случайном свободном порту: фиксированный конфликтовал бы с каталогом,
# запущенным из IDE, и с соседними контекстами тестов.
spring.grpc.server.port=0
