name: Images

# Образы сервисов в GitHub Container Registry — после мержа в dev или main.
#
# Каждый сервис выкатывается сам по себе: собирается образ только того сервиса, который
# изменился. У образа два тега:
#   - <sha коммита> — неизменяемый, его и разворачивают: по нему всегда понятно, какой код
#     внутри, и откат — это развёртывание предыдущего sha;
#   - <ветка> (dev/main) — плавающий, указывает на последний образ ветки; удобен локально.
on:
  push:
    branches: [main, dev]

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Запись в реестр пакетов — только этому workflow и только на время публикации.
  packages: write

jobs:
  changes:
    name: Что изменилось
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            service: &build
              - 'pom.xml'
              - 'mvnw'
              - '.mvn/**'
              - 'Dockerfile'
              - 'libs/**'
              - 'service/**'
            notification-service:
              - *build
              - 'notification-service/**'
            catalog-service:
              - *build
              - 'openapi/**'
              - 'catalog-service/**'
            identity-service:
              - *build
              - 'identity-service/**'
            order-service:
              - *build
              - 'order-service/**'
            payment-service:
              - *build
              - 'payment-service/**'
            tracking-service:
              - *build
              - 'tracking-service/**'
            api-gateway:
              - *build
              - 'api-gateway/**'

  image:
    name: Образ ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имя образа в GHCR обязано быть в нижнем регистре, а владелец репозитория — нет.
      # Монолит в реестре называется core: так же, как в compose.
      - name: Имя образа
        id: name
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          service="${{ matrix.service }}"
          [ "$service" = "service" ] && service="core"
          echo "image=ghcr.io/${owner}/food-delivery-${service}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
          # Слои сборки кэшируются между прогонами по сервису: зависимости Maven
          # не скачиваются заново на каждый коммит.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
