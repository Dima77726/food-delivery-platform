# Ключ version намеренно отсутствует: в Compose V2 он не используется и вызывает
# предупреждение при запуске.

services:
  postgres:
    image: postgres:16
    container_name: food-delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - food_delivery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-delivery-app
    restart: unless-stopped
    depends_on:
      postgres:
        # Именно service_healthy, а не service_started: контейнер с Postgres поднимается
        # за долю секунды, а принимать соединения начинает позже. Со service_started
        # Liquibase падал бы на старте примерно в половине запусков.
        condition: service_healthy
    # Список, а не отображение: только в этой форме запись вида `- JWT_SECRET` без значения
    # означает «пробросить переменную, если она задана, и не задавать её иначе».
    #
    # Запись `JWT_SECRET: ${JWT_SECRET:-}` выглядит равнозначной, но ведёт себя иначе:
    # она всегда передаёт переменную, подставляя пустую строку. Для Spring пустая строка —
    # это заданное значение, поэтому default из application.yml перестаёт применяться,
    # и приложение падает на пустом ключе подписи.
    environment:
      # Внутри сети compose обращение идёт по имени сервиса и всегда на порт 5432 —
      # проброс на хост здесь ни при чём.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
      # Не заданы — приложение возьмёт dev-значение и предупредит в логе.
      # В .env их держать можно, в репозитории — нет.
      - JWT_SECRET
      - APP_ADMIN_EMAIL
      - APP_ADMIN_PASSWORD
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  food_delivery_postgres_data:
