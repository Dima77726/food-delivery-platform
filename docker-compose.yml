# Ключ version намеренно отсутствует: в Compose V2 он не используется и вызывает
# предупреждение при запуске.

services:
  postgres:
    image: postgres:16
    container_name: food-delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - food_delivery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: food-delivery-redis
    restart: unless-stopped
    # appendonly включён, чтобы кэш переживал перезапуск контейнера. Для чистого кэша это
    # не обязательно — данные восстановимы из базы, — но холодный старт после каждого
    # docker compose restart бьёт по той самой базе, ради разгрузки которой кэш и ставили.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - food_delivery_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"

  kafka:
    image: apache/kafka:3.9.0
    container_name: food-delivery-kafka
    restart: unless-stopped
    environment:
      # KRaft: Kafka сама хранит метаданные кластера, ZooKeeper больше не нужен.
      # Один узел совмещает роли брокера и контроллера — локальному стеку этого хватает.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Два листенера — ключевой момент для схемы «инфраструктура в Docker, сервис из IDE».
      # Клиент подключается к любому адресу, получает от брокера список advertised-адресов
      # и дальше ходит уже по ним. Поэтому изнутри сети нужен kafka:9092, а с хоста —
      # localhost:9094; одним адресом обойтись нельзя, они резолвятся в разных местах.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # На одном узле реплик больше одной быть не может, поэтому фактор репликации
      # служебных топиков нужно понизить — с дефолтными тремя брокер не стартует.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - food_delivery_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    ports:
      - "${KAFKA_PORT:-9094}:9094"

  # Приложение под профилем: обычный `docker compose up -d` его НЕ поднимает.
  #
  # Инфраструктура одинакова у всех и меняется раз в полгода — её удобно один раз описать
  # и забыть. Код сервиса меняется каждые пять минут, и цикл mvn package + docker build +
  # рестарт стоит около минуты против трёх секунд перезапуска из IDE, плюс нет отладчика.
  #
  # Контейнер при этом нужен: он проверяет, что образ собирается и стартует — то же самое
  # поедет в CI и на стенд. Поэтому не удалён, а спрятан:
  #   docker compose up -d                        — только инфраструктура
  #   docker compose --profile full up -d --build — весь стек
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-delivery-app
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        # Именно service_healthy, а не service_started: контейнер с Postgres поднимается
        # за долю секунды, а принимать соединения начинает позже. Со service_started
        # Liquibase падал бы на старте примерно в половине запусков.
        condition: service_healthy
    # Список, а не отображение: только в этой форме запись вида `- JWT_SECRET` без значения
    # означает «пробросить переменную, если она задана, и не задавать её иначе».
    #
    # Запись `JWT_SECRET: ${JWT_SECRET:-}` выглядит равнозначной, но ведёт себя иначе:
    # она всегда передаёт переменную, подставляя пустую строку. Для Spring пустая строка —
    # это заданное значение, поэтому default из application.yml перестаёт применяться,
    # и приложение падает на пустом ключе подписи.
    environment:
      # Внутри сети compose обращение идёт по имени сервиса и всегда на порт 5432 —
      # проброс на хост здесь ни при чём.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Внутри сети — внутренний листенер брокера.
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TZ=${TZ}
      # Не заданы — приложение возьмёт dev-значение и предупредит в логе.
      # В .env их держать можно, в репозитории — нет.
      - JWT_SECRET
      - APP_ADMIN_EMAIL
      - APP_ADMIN_PASSWORD
    ports:
      # Публикуется только прикладной порт. Служебный 8081 остаётся внутри сети compose:
      # снимать метрики может Prometheus, а снаружи их не видно.
      - "${APP_PORT:-8080}:8080"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: food-delivery-prometheus
    restart: unless-stopped
    # depends_on: app убран намеренно. Compose отказывается стартовать, если зависимость
    # выключена профилем, а Prometheus в приложении и не нуждается: недоступный таргет
    # он показывает как DOWN и продолжает работать.
    extra_hosts:
      # На Docker Desktop host.docker.internal резолвится сам, на Linux — нет.
      # Эта строка делает конфигурацию одинаковой на всех машинах.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - food_delivery_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 15 дней истории: локальному стеку больше незачем, а диск не резиновый.
      - --storage.tsdb.retention.time=15d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: food-delivery-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Логин/пароль по умолчанию admin/admin. Это локальный стек, наружу он не смотрит;
      # в любом другом окружении пароль обязан приходить из переменной окружения.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      # Дашборд и источник данных приезжают провижинингом, поэтому мастер первого запуска
      # только мешает.
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - food_delivery_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  food_delivery_postgres_data:
  food_delivery_kafka_data:
  food_delivery_redis_data:
  food_delivery_prometheus_data:
  food_delivery_grafana_data:
