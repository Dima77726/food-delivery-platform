# Ключ version намеренно отсутствует: в Compose V2 он не используется и вызывает
# предупреждение при запуске.

services:
  postgres:
    image: postgres:16
    container_name: food-delivery-postgres
    restart: unless-stopped
    environment:
      # Форма ${VAR:?...} останавливает Compose до запуска контейнеров и называет
      # недостающую переменную. Значения берутся из .env, образец — в .env.example.
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - food_delivery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Базы и учётные записи сервисов: у каждого сервиса своя база и свой пользователь
  # (database-per-service). Локально все базы живут в одном контейнере PostgreSQL —
  # держать по контейнеру на сервис ради изоляции, которую и так дают права доступа,
  # незачем. В продакшене каждая база переезжает на свой сервер сменой одного URL.
  #
  # Одноразовый контейнер: отработал и вышел. Выполняется при каждом up и идемпотентен —
  # подробности в самом скрипте. Профиля нет: базы нужны и сервисам, запущенным из IDE.
  postgres-provision:
    image: postgres:16
    container_name: food-delivery-postgres-provision
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
      PGUSER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:?задайте NOTIFICATION_DB_USER в .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?задайте NOTIFICATION_DB_PASSWORD в .env}
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-catalog}
      CATALOG_DB_USER: ${CATALOG_DB_USER:?задайте CATALOG_DB_USER в .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?задайте CATALOG_DB_PASSWORD в .env}
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-identity}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:?задайте IDENTITY_DB_USER в .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?задайте IDENTITY_DB_PASSWORD в .env}
    volumes:
      - ./docker/postgres/provision-service-databases.sh:/provision.sh:ro
    entrypoint: ["sh", "/provision.sh"]

  # Сертификаты для взаимного TLS между сервисами: свой CA и по сертификату на сервис.
  # Одноразовый контейнер: выпускает их в общий том при первом запуске и больше ничего
  # не трогает. Пересоздать — удалить том food_delivery_grpc_certs.
  #
  # Образ postgres:16 взят ради openssl, который в нём уже есть: отдельный образ ради одной
  # команды — ещё одна загрузка без пользы.
  grpc-certs:
    image: postgres:16
    container_name: food-delivery-grpc-certs
    restart: "no"
    volumes:
      - ./docker/grpc-certs/generate-certs.sh:/generate-certs.sh:ro
      - food_delivery_grpc_certs:/certs
    entrypoint: ["sh", "/generate-certs.sh", "/certs", "core", "catalog-service", "identity-service"]

  redis:
    image: redis:7-alpine
    container_name: food-delivery-redis
    restart: unless-stopped
    # appendonly включён, чтобы кэш переживал перезапуск контейнера. Для чистого кэша это
    # не обязательно — данные восстановимы из базы, — но холодный старт после каждого
    # docker compose restart бьёт по той самой базе, ради разгрузки которой кэш и ставили.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - food_delivery_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"

  kafka:
    image: apache/kafka:3.9.0
    container_name: food-delivery-kafka
    restart: unless-stopped
    environment:
      # KRaft: Kafka сама хранит метаданные кластера, ZooKeeper больше не нужен.
      # Один узел совмещает роли брокера и контроллера — локальному стеку этого хватает.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Два листенера — ключевой момент для схемы «инфраструктура в Docker, сервис из IDE».
      # Клиент подключается к любому адресу, получает от брокера список advertised-адресов
      # и дальше ходит уже по ним. Поэтому изнутри сети нужен kafka:9092, а с хоста —
      # localhost:9094; одним адресом обойтись нельзя, они резолвятся в разных местах.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # На одном узле реплик больше одной быть не может, поэтому фактор репликации
      # служебных топиков нужно понизить — с дефолтными тремя брокер не стартует.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - food_delivery_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    ports:
      - "${KAFKA_PORT:-9094}:9094"

  # Веб-интерфейс к брокеру: топики, партиции, лаг групп, чтение и отправка сообщений.
  #
  # Нужен ровно за тем же, зачем Grafana рядом с Prometheus. Kafka не отдаёт ничего
  # наглядного: очередь — это лог с офсетами, и без интерфейса вопрос «а сообщение-то
  # дошло?» решается связкой консольных скриптов внутри контейнера.
  #
  # Отдельно полезен для DLT: увидеть, что туда прилетело и с какой причиной в заголовках,
  # иначе придётся ловить это в логах приложения.
  #
  # Образ от kafbat — продолжение provectuslabs/kafka-ui, который автор заархивировал.
  kafka-ui:
    image: kafbat/kafka-ui:v1.0.0
    container_name: food-delivery-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Внутренний листенер: UI живёт в сети compose, а не на хосте.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Разрешает менять настройки кластера прямо из интерфейса — в том числе создавать
      # топики и отправлять сообщения. Для локального стека удобно, для любого другого
      # окружения обязано быть выключено.
      DYNAMIC_CONFIG_ENABLED: "true"
      # Интерфейс без авторизации. Наружу он не публикуется дальше localhost,
      # но в общей сети так оставлять нельзя.
      AUTH_TYPE: DISABLED
    ports:
      # Не 8080: там уже висит шлюз.
      - "${KAFKA_UI_PORT:-8090}:8080"

  # Сервисы приложения — все под профилем full: обычный `docker compose up -d` их НЕ поднимает.
  #
  # У каждого сервиса и build, и image. По умолчанию (IMAGE_TAG=local) compose собирает образы
  # из исходников и называет их так же, как они называются в реестре. Готовые образы из
  # GitHub Container Registry — те, что собрал CI после мержа, — поднимаются без сборки:
  #   IMAGE_TAG=dev docker compose --profile full pull
  #   IMAGE_TAG=dev docker compose --profile full up -d --no-build
  # Вместо dev можно взять sha конкретного коммита — так поднимается ровно та версия.
  #
  #   api-gateway          — единственный сервис, опубликованный наружу (порт 8080);
  #   core                 — монолит: всё, что ещё не вынесено в отдельные сервисы;
  #   catalog-service      — рестораны, меню, поиск;
  #   identity-service     — пользователи, вход, выпуск токенов;
  #   notification-service — уведомления.
  #
  # Синхронные вызовы между сервисами — gRPC на порту 9090 внутри сети: корзина спрашивает
  # у каталога ресторан и блюдо, каталог и монолит у identity-service — права на ресторан.
  #
  # Токены подписывает только identity-service закрытым RSA-ключом. Остальные проверяют их
  # открытым ключом из его JWKS — общего секрета у сервисов больше нет.
  #
  # Внутри сети все слушают 8080 (API) и 8081 (actuator): у каждого контейнера своё сетевое
  # пространство, и одинаковые порты не конфликтуют. Различные порты по умолчанию в их
  # application.yml нужны только для запуска из IDE, где все сервисы делят localhost.
  #
  # Монолит и сервисы наружу не публикуются: снаружи в систему ведёт одна дверь — шлюз.
  #
  # Инфраструктура одинакова у всех и меняется раз в полгода — её удобно один раз описать
  # и забыть. Код сервиса меняется каждые пять минут, и цикл mvn package + docker build +
  # рестарт стоит около минуты против трёх секунд перезапуска из IDE, плюс нет отладчика.
  #
  # Контейнер при этом нужен: он проверяет, что образ собирается и стартует — то же самое
  # поедет в CI и на стенд. Поэтому не удалён, а спрятан:
  #   docker compose up -d                        — только инфраструктура
  #   docker compose --profile full up -d --build — весь стек
  core:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-core:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: service
    container_name: food-delivery-core
    restart: unless-stopped
    # По умолчанию Docker добивает контейнер через 10 секунд после SIGTERM. Приложение
    # завершается штатно и ждёт текущую работу до 20 секунд (spring.lifecycle
    # .timeout-per-shutdown-phase), поэтому запас здесь больше — иначе штатное завершение
    # обрывалось бы ровно так же, как без него, только незаметнее.
    stop_grace_period: 30s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres:
        # Именно service_healthy, а не service_started: контейнер с Postgres поднимается
        # за долю секунды, а принимать соединения начинает позже. Со service_started
        # Liquibase падал бы на старте примерно в половине запусков.
        condition: service_healthy
    # Список, а не отображение: только в этой форме запись вида `- NEO4J_PASSWORD` без значения
    # означает «пробросить переменную, если она задана, и не задавать её иначе».
    # Значение Compose берёт из .env или из окружения оболочки.
    #
    # Запись `NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}` выглядит равнозначной, но ведёт себя иначе:
    # она всегда передаёт переменную, подставляя пустую строку. Для Spring пустая строка —
    # это заданное значение, и вместо понятной ошибки о незаданной переменной приложение
    # упало бы на пустом пароле.
    #
    # Форму ${VAR:?...} здесь применять нельзя: Compose разбирает весь файл целиком,
    # до отбора по профилям, и обязательная переменная сервиса под профилем full ломала бы
    # обычный `docker compose up` без приложения. Недостающие переменные ловит само
    # приложение — на старте, с указанием имени переменной.
    volumes:
      - food_delivery_grpc_certs:/certs:ro
    environment:
      # Внутри сети compose обращение идёт по имени сервиса и всегда на порт 5432 —
      # проброс на хост здесь ни при чём.
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      # gRPC-клиенты: каталог (ресторан и блюдо) и сервис пользователей (права на ресторан).
      - CATALOG_GRPC_ADDRESS=static://catalog-service:9090
      - IDENTITY_GRPC_ADDRESS=static://identity-service:9090
      # Взаимный TLS на gRPC: свой сертификат (CN=core) и CA, которому верить.
      - SPRING_PROFILES_ACTIVE=grpc-tls
      - GRPC_TLS_CERTIFICATE=file:/certs/core.crt
      - GRPC_TLS_PRIVATE_KEY=file:/certs/core.key
      - GRPC_TLS_CA=file:/certs/ca.crt
      # Внутри сети — внутренний листенер брокера.
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TZ=${TZ}
      # Открытые ключи для проверки токенов — у сервиса пользователей. Секрета подписи у сервиса нет.
      - JWT_JWK_SET_URI=http://identity-service:8080/.well-known/jwks.json

      # Адреса пяти дополнительных хранилищ. Проставлены всегда, а работают только вместе
      # с соответствующим STORE_*_ENABLED — сами по себе они ничего не включают.
      #
      # depends_on на эти сервисы намеренно нет: Compose отказывается стартовать, если
      # зависимость выключена профилем, и приложение перестало бы подниматься без профиля
      # stores. Порядок старта здесь обеспечивается иначе — сначала поднимают
      # инфраструктуру, потом приложение.
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - CASSANDRA_CONTACT_POINTS=cassandra:9042
      - NEO4J_URI=bolt://neo4j:7687
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123

      # Выключатели и секреты хранилищ пробрасываются без значений: не заданы в .env —
      # применится значение по умолчанию из application.yml, то есть выключено.
      - STORE_MONGO_ENABLED
      - STORE_CASSANDRA_ENABLED
      - STORE_NEO4J_ENABLED
      - STORE_CLICKHOUSE_ENABLED
      - NEO4J_USERNAME
      - NEO4J_PASSWORD
      - CLICKHOUSE_DB
      - CLICKHOUSE_USER
      - CLICKHOUSE_PASSWORD
    # Портов наружу нет: запросы приходят через шлюз. Для отладки в обход шлюза монолит
    # удобнее запускать из IDE — там он слушает localhost:8082.

  catalog-service:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-catalog-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: catalog-service
    container_name: food-delivery-catalog-service
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres-provision:
        condition: service_completed_successfully
    volumes:
      - food_delivery_grpc_certs:/certs:ro
    environment:
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      - GRPC_PORT=9090
      # Права на рестораны знает сервис пользователей — каталог спрашивает его по gRPC.
      - IDENTITY_GRPC_ADDRESS=static://identity-service:9090
      # Взаимный TLS на gRPC: свой сертификат (CN=catalog-service) и CA, которому верить.
      - SPRING_PROFILES_ACTIVE=grpc-tls
      - GRPC_TLS_CERTIFICATE=file:/certs/catalog-service.crt
      - GRPC_TLS_PRIVATE_KEY=file:/certs/catalog-service.key
      - GRPC_TLS_CA=file:/certs/ca.crt
      - CATALOG_DB_HOST=postgres
      - CATALOG_DB_PORT=5432
      - CATALOG_DB_NAME=${CATALOG_DB_NAME:-catalog}
      - CATALOG_DB_USER
      - CATALOG_DB_PASSWORD
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Поиск переехал сюда вместе со своим выключателем.
      - ELASTIC_HOST=elasticsearch
      - ELASTIC_PORT=9200
      - STORE_ELASTICSEARCH_ENABLED
      - TZ=${TZ}
      # Открытые ключи для проверки токенов — у сервиса пользователей. Секрета подписи у сервиса нет.
      - JWT_JWK_SET_URI=http://identity-service:8080/.well-known/jwks.json

  identity-service:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-identity-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: identity-service
    container_name: food-delivery-identity-service
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      postgres-provision:
        condition: service_completed_successfully
    volumes:
      - food_delivery_grpc_certs:/certs:ro
    environment:
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      - GRPC_PORT=9090
      # Взаимный TLS на gRPC: свой сертификат (CN=identity-service) и CA, которому верить.
      - SPRING_PROFILES_ACTIVE=grpc-tls
      - GRPC_TLS_CERTIFICATE=file:/certs/identity-service.crt
      - GRPC_TLS_PRIVATE_KEY=file:/certs/identity-service.key
      - GRPC_TLS_CA=file:/certs/ca.crt
      - IDENTITY_DB_HOST=postgres
      - IDENTITY_DB_PORT=5432
      - IDENTITY_DB_NAME=${IDENTITY_DB_NAME:-identity}
      - IDENTITY_DB_USER
      - IDENTITY_DB_PASSWORD
      # Закрытый ключ подписи токенов. Есть только у этого сервиса — в этом весь смысл RS256.
      - JWT_PRIVATE_KEY
      - JWT_KEY_ID
      - JWT_ACCESS_TOKEN_TTL=${JWT_ACCESS_TOKEN_TTL:-PT15M}
      - JWT_REFRESH_TOKEN_TTL=${JWT_REFRESH_TOKEN_TTL:-P30D}
      - APP_ADMIN_EMAIL
      - APP_ADMIN_PASSWORD
      - TZ=${TZ}

  notification-service:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-notification-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: notification-service
    container_name: food-delivery-notification-service
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      kafka:
        condition: service_healthy
      postgres-provision:
        # База сервиса существует только после того, как отработал провижининг.
        condition: service_completed_successfully
    environment:
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      - NOTIFICATION_DB_HOST=postgres
      - NOTIFICATION_DB_PORT=5432
      - NOTIFICATION_DB_NAME=${NOTIFICATION_DB_NAME:-notification}
      - NOTIFICATION_DB_USER
      - NOTIFICATION_DB_PASSWORD
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TZ=${TZ}
      # Открытые ключи для проверки токенов — у сервиса пользователей. Секрета подписи у сервиса нет.
      - JWT_JWK_SET_URI=http://identity-service:8080/.well-known/jwks.json

  api-gateway:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-api-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    container_name: food-delivery-api-gateway
    restart: unless-stopped
    stop_grace_period: 30s
    # depends_on на сервисы намеренно нет. Шлюз не нуждается в них для старта: недоступный
    # сервис означает 503 на его маршрутах, а не упавший шлюз. Ровно так это и должно
    # работать в бою — один лежащий сервис не роняет вход в систему целиком.
    environment:
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      - CORE_SERVICE_URL=http://core:8080
      - CATALOG_SERVICE_URL=http://catalog-service:8080
      - IDENTITY_SERVICE_URL=http://identity-service:8080
      - NOTIFICATION_SERVICE_URL=http://notification-service:8080
      - TZ=${TZ}
    ports:
      # Единственный опубликованный порт приложения. Служебный 8081 остаётся внутри сети
      # compose: снимать метрики может Prometheus, а снаружи их не видно.
      - "${APP_PORT:-8080}:8080"

  # --- Пять дополнительных хранилищ ---------------------------------------------------------
  #
  # Все под профилем stores: обычный `docker compose up -d` их не поднимает. Вместе они
  # занимают около пяти гигабайт памяти, а нужны только тем модулям, которые с ними работают.
  #
  #   docker compose --profile stores up -d          — инфраструктура плюс эти пять
  #   docker compose --profile stores --profile full up -d --build   — вообще всё
  #
  # Одного профиля мало: в .env нужно ещё выставить STORE_*_ENABLED=true, иначе приложение
  # поднимется без этих модулей. Разделение намеренное — контейнер можно держать поднятым,
  # а модуль выключенным, и наоборот нельзя: включённый модуль требует доступного сервера.
  #
  # Ограничения памяти у Java-сервисов (Elasticsearch, Cassandra, Neo4j) выставлены явно.
  # По умолчанию каждый из них берёт долю от памяти хоста и на машине с 32 ГБ забирает
  # несколько гигабайт под кучу, которую локальному стеку девать некуда.

  mongo:
    profiles: ["stores"]
    image: mongo:8.0
    container_name: food-delivery-mongo
    restart: unless-stopped
    # Аутентификация не включена намеренно: это локальный стек, наружу он не смотрит,
    # а строка подключения в application.yml остаётся без пароля и не просит секрета
    # в репозитории. В любом другом окружении MONGO_INITDB_ROOT_* обязательны.
    environment:
      TZ: ${TZ}
    volumes:
      - food_delivery_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${MONGO_PORT:-27017}:27017"

  cassandra:
    profiles: ["stores"]
    image: cassandra:5.0
    container_name: food-delivery-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: food-delivery
      # Имя дата-центра должно совпадать с app.stores.cassandra.local-datacenter.
      # Драйвер 4.x требует его явно и при расхождении не находит ни одного узла:
      # ошибка выглядит как "no node was available", хотя узел работает.
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      TZ: ${TZ}
    volumes:
      - food_delivery_cassandra_data:/var/lib/cassandra
    # Cassandra поднимается заметно дольше остальных: старт занимает около минуты,
    # поэтому и start_period большой. Проверка через nodetool, а не через cqlsh:
    # cqlsh требует Python в контейнере и отвечает позже, чем узел начинает работать.
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q ^UN || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"

  neo4j:
    profiles: ["stores"]
    image: neo4j:5.26
    container_name: food-delivery-neo4j
    restart: unless-stopped
    environment:
      # Пароль обязателен: без NEO4J_AUTH образ требует сменить пароль при первом входе,
      # и драйвер получает отказ, не объясняющий причины.
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
      TZ: ${TZ}
    volumes:
      - food_delivery_neo4j_data:/data
    healthcheck:
      # wget, а не curl: в образе neo4j curl не установлен, и проверка на нём всегда
      # возвращала бы "curl: not found" — контейнер вечно unhealthy при живой базе.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      # 7474 — веб-интерфейс с окном запросов Cypher, 7687 — сам протокол bolt.
      # Интерфейс полезен ровно так же, как Kafka UI: граф удобнее один раз увидеть.
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"

  clickhouse:
    profiles: ["stores"]
    image: clickhouse/clickhouse-server:25.3
    container_name: food-delivery-clickhouse
    restart: unless-stopped
    environment:
      # Без явно заданной учётной записи образ закрывает сетевой доступ для default.
      # Эти локальные значения совпадают с настройками приложения; переопределяются в .env.
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-food_delivery}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: ${TZ}
    # ClickHouse открывает много файлов одновременно и с лимитом по умолчанию
    # пишет в лог предупреждение на каждом запуске.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - food_delivery_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --database \"$$CLICKHOUSE_DB\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      # 8123 — HTTP-интерфейс, по нему и ходит JDBC-драйвер.
      - "${CLICKHOUSE_PORT:-8123}:8123"

  elasticsearch:
    profiles: ["stores"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: food-delivery-elasticsearch
    restart: unless-stopped
    environment:
      # Один узел: кворум мастеров для локального стека не нужен и не соберётся.
      discovery.type: single-node
      # Безопасность выключена намеренно. С ней образ поднимается по HTTPS с самоподписанным
      # сертификатом и требует пароль, то есть в приложение пришлось бы тащить truststore
      # ради локальной разработки. Вне локального стека так делать нельзя.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: ${TZ}
    volumes:
      - food_delivery_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      # Проверяется только то, что кластер отвечает. Ждать статуса green бессмысленно:
      # на одном узле реплики разместить негде, и он остаётся жёлтым навсегда.
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    ports:
      - "${ELASTIC_PORT:-9200}:9200"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: food-delivery-prometheus
    restart: unless-stopped
    # depends_on на сервисы приложения убран намеренно. Compose отказывается стартовать, если зависимость
    # выключена профилем, а Prometheus в приложении и не нуждается: недоступный таргет
    # он показывает как DOWN и продолжает работать.
    extra_hosts:
      # На Docker Desktop host.docker.internal резолвится сам, на Linux — нет.
      # Эта строка делает конфигурацию одинаковой на всех машинах.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - food_delivery_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 15 дней истории: локальному стеку больше незачем, а диск не резиновый.
      - --storage.tsdb.retention.time=15d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: food-delivery-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Пароль администратора Grafana. Значения по умолчанию нет намеренно: admin/admin
      # в файле репозитория — это тот же захардкоженный пароль, только привычный.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?задайте GRAFANA_PASSWORD в .env}
      # Дашборд и источник данных приезжают провижинингом, поэтому мастер первого запуска
      # только мешает.
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - food_delivery_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  food_delivery_postgres_data:
  food_delivery_kafka_data:
  food_delivery_redis_data:
  food_delivery_prometheus_data:
  food_delivery_grafana_data:
  # Сертификаты mTLS. Не данные — их можно удалить, и grpc-certs выпустит новые.
  food_delivery_grpc_certs:
  # Тома дополнительных хранилищ объявлены безусловно: список томов профилями
  # не управляется, а неиспользованный том места не занимает.
  #
  # Три из этих четырёх содержат производные данные — витрину аналитики, граф рекомендаций
  # и поисковый индекс. Их можно удалить целиком (docker compose down -v), и они построятся
  # заново из PostgreSQL и Kafka. Отзывы в MongoDB и трек в Cassandra так не восстановятся:
  # это единственные данные вне PostgreSQL, у которых нет второго источника.
  food_delivery_mongo_data:
  food_delivery_cassandra_data:
  food_delivery_neo4j_data:
  food_delivery_clickhouse_data:
  food_delivery_elasticsearch_data:
