# Ключ version намеренно отсутствует: в Compose V2 он не используется и вызывает
# предупреждение при запуске.

# Память. Каждому долгоживущему контейнеру задан mem_limit, и это не перестраховка.
# JVM внутри контейнера считает «всей памятью» его лимит, а без лимита — всю виртуальную
# машину Docker. С -XX:MaxRAMPercentage из Dockerfile каждый из восьми сервисов считал бы
# своей кучей несколько гигабайт, и вместе они вытеснили бы всё остальное, включая
# контейнеры Testcontainers. Лимиты подобраны под ноутбук с 16 ГБ: весь стек с профилями
# full и stores укладывается примерно в 12 ГБ потолков, а реально занимает меньше.
# Таблица бюджета — в README, раздел «Память».

services:
  postgres:
    image: postgres:16
    container_name: food-delivery-postgres
    mem_limit: 512m
    restart: unless-stopped
    environment:
      # Форма ${VAR:?...} останавливает Compose до запуска контейнеров и называет
      # недостающую переменную. Значения берутся из .env, образец — в .env.example.
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      TZ: ${TZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - food_delivery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Базы и учётные записи сервисов: у каждого сервиса своя база и свой пользователь
  # (database-per-service). Локально все базы живут в одном контейнере PostgreSQL —
  # держать по контейнеру на сервис ради изоляции, которую и так дают права доступа,
  # незачем. В продакшене каждая база переезжает на свой сервер сменой одного URL.
  #
  # Одноразовый контейнер: отработал и вышел. Выполняется при каждом up и идемпотентен —
  # подробности в самом скрипте. Профиля нет: базы нужны и сервисам, запущенным из IDE.
  postgres-provision:
    image: postgres:16
    container_name: food-delivery-postgres-provision
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
      PGUSER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:-notification}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:?задайте NOTIFICATION_DB_USER в .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?задайте NOTIFICATION_DB_PASSWORD в .env}
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-catalog}
      CATALOG_DB_USER: ${CATALOG_DB_USER:?задайте CATALOG_DB_USER в .env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?задайте CATALOG_DB_PASSWORD в .env}
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-identity}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:?задайте IDENTITY_DB_USER в .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?задайте IDENTITY_DB_PASSWORD в .env}
      ORDER_DB_NAME: ${ORDER_DB_NAME:-orders}
      ORDER_DB_USER: ${ORDER_DB_USER:?задайте ORDER_DB_USER в .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?задайте ORDER_DB_PASSWORD в .env}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payments}
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:?задайте PAYMENT_DB_USER в .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?задайте PAYMENT_DB_PASSWORD в .env}
    volumes:
      - ./docker/postgres/provision-service-databases.sh:/provision.sh:ro
    entrypoint: ["sh", "/provision.sh"]

  # Сертификаты для взаимного TLS между сервисами: свой CA и по сертификату на сервис.
  # Одноразовый контейнер: при первом запуске выпускает CA и все сертификаты, при следующих —
  # только недостающие (например, для нового сервиса). Пересоздать всё — удалить том
  # food_delivery_grpc_certs.
  #
  # Образ postgres:16 взят ради openssl, который в нём уже есть: отдельный образ ради одной
  # команды — ещё одна загрузка без пользы.
  grpc-certs:
    image: postgres:16
    container_name: food-delivery-grpc-certs
    restart: "no"
    volumes:
      - ./docker/grpc-certs/generate-certs.sh:/generate-certs.sh:ro
      - food_delivery_grpc_certs:/certs
    entrypoint: ["sh", "/generate-certs.sh", "/certs", "insights-service", "catalog-service", "identity-service", "order-service", "tracking-service", "notification-service"]

  # Одноразовый перенос заказов и платежей из базы монолита в базы order-service
  # и payment-service. Ждёт, пока все три схемы появятся, переносит только в пустые базы
  # и сохраняет идентификаторы. Повторный запуск безопасен:
  #   docker compose --profile full up orders-data-migration
  orders-data-migration:
    profiles: ["full"]
    image: postgres:16
    container_name: food-delivery-orders-data-migration
    restart: "no"
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      MONOLITH_DB_NAME: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
      MONOLITH_SCHEMA: ${APP_SCHEMA:-food_app}
      ORDER_DB_NAME: ${ORDER_DB_NAME:-orders}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payments}
    volumes:
      - ./docker/migrations/orders-from-monolith.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]

  redis:
    image: redis:7-alpine
    container_name: food-delivery-redis
    mem_limit: 320m
    restart: unless-stopped
    # appendonly включён, чтобы кэш переживал перезапуск контейнера. Для чистого кэша это
    # не обязательно — данные восстановимы из базы, — но холодный старт после каждого
    # docker compose restart бьёт по той самой базе, ради разгрузки которой кэш и ставили.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - food_delivery_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"

  kafka:
    image: apache/kafka:3.9.0
    container_name: food-delivery-kafka
    mem_limit: 1g
    restart: unless-stopped
    environment:
      # KRaft: Kafka сама хранит метаданные кластера, ZooKeeper больше не нужен.
      # Один узел совмещает роли брокера и контроллера — локальному стеку этого хватает.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Два листенера — ключевой момент для схемы «инфраструктура в Docker, сервис из IDE».
      # Клиент подключается к любому адресу, получает от брокера список advertised-адресов
      # и дальше ходит уже по ним. Поэтому изнутри сети нужен kafka:9092, а с хоста —
      # localhost:9094; одним адресом обойтись нельзя, они резолвятся в разных местах.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # На одном узле реплик больше одной быть не может, поэтому фактор репликации
      # служебных топиков нужно понизить — с дефолтными тремя брокер не стартует.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Куча брокера. По умолчанию скрипт запуска берёт 1 ГБ, а локальному брокеру с десятком
      # топиков хватает половины. Остальное под лимитом контейнера уходит в page cache —
      # Kafka читает с диска через него, и это ему полезнее, чем лишняя куча.
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - food_delivery_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    ports:
      - "${KAFKA_PORT:-9094}:9094"

  # Брокер очередей. Kafka — журнал событий («что произошло»), RabbitMQ — очереди задач
  # («сделай это»): подтверждение каждого сообщения, повтор через TTL и dead-letter exchange,
  # приоритеты. Сейчас через него идёт рассылка уведомлений.
  #
  # Плагины — из docker/rabbitmq/enabled_plugins: интерфейс управления (порт 15672),
  # метрики для Prometheus (15692) и STOMP — для трека курьера по WebSocket.
  rabbitmq:
    image: rabbitmq:4.1.4-management
    container_name: food-delivery-rabbitmq
    mem_limit: 512m
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?задайте RABBITMQ_USER в .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?задайте RABBITMQ_PASSWORD в .env}
      TZ: ${TZ}
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - food_delivery_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"

  # Веб-интерфейс к брокеру: топики, партиции, лаг групп, чтение и отправка сообщений.
  #
  # Нужен ровно за тем же, зачем Grafana рядом с Prometheus. Kafka не отдаёт ничего
  # наглядного: очередь — это лог с офсетами, и без интерфейса вопрос «а сообщение-то
  # дошло?» решается связкой консольных скриптов внутри контейнера.
  #
  # Отдельно полезен для DLT: увидеть, что туда прилетело и с какой причиной в заголовках,
  # иначе придётся ловить это в логах приложения.
  #
  # Образ от kafbat — продолжение provectuslabs/kafka-ui, который автор заархивировал.
  #
  # Профиль tools: интерфейс нужен, когда в Kafka что-то разглядывают, а держать ради этого
  # ещё одну JVM постоянно незачем. Включить: docker compose --profile tools up -d kafka-ui
  kafka-ui:
    profiles: ["tools"]
    image: kafbat/kafka-ui:v1.0.0
    container_name: food-delivery-kafka-ui
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Внутренний листенер: UI живёт в сети compose, а не на хосте.
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Разрешает менять настройки кластера прямо из интерфейса — в том числе создавать
      # топики и отправлять сообщения. Для локального стека удобно, для любого другого
      # окружения обязано быть выключено.
      DYNAMIC_CONFIG_ENABLED: "true"
      # Интерфейс без авторизации. Наружу он не публикуется дальше localhost,
      # но в общей сети так оставлять нельзя.
      AUTH_TYPE: DISABLED
      # Половина лимита под кучу: по умолчанию JVM взяла бы четверть, и интерфейсу её мало.
      JAVA_OPTS: -XX:MaxRAMPercentage=50
    ports:
      # Не 8080: там уже висит шлюз.
      - "${KAFKA_UI_PORT:-8090}:8080"

  # Сервисы приложения — все под профилем full: обычный `docker compose up -d` их НЕ поднимает.
  #
  # Образы сервисов собирают их собственные репозитории (food-delivery-<сервис>) и публикуют
  # в GitHub Container Registry на каждый пуш в main и dev. Здесь они только подтягиваются:
  #   docker compose --profile full pull
  #   docker compose --profile full up -d
  #
  # Тег по умолчанию — main. Общий IMAGE_TAG меняет его у всех сразу (dev, sha коммита), а
  # <СЕРВИС>_TAG — у одного: сервис, который вы сейчас правите, поднимается из локальной
  # сборки, остальные остаются готовыми:
  #   cd ../food-delivery-order-service && docker build --secret id=maven_settings,src=$HOME/.m2/settings.xml   #       -t ghcr.io/dima77726/food-delivery-order-service:local .
  #   ORDER_SERVICE_TAG=local docker compose --profile full up -d order-service
  #
  #   api-gateway          — единственный сервис, опубликованный наружу (порт 8080);
  #   insights-service     — отзывы, аналитика, рекомендации, GraphQL (всё, что осталось от монолита);
  #   catalog-service      — рестораны, меню, поиск;
  #   identity-service     — пользователи, вход, выпуск токенов;
  #   notification-service — уведомления;
  #   order-service        — корзина, заказ, доставка, оркестратор саги оплаты;
  #   payment-service      — платежи: списания и возвраты по командам саги.
  #
  # Синхронные вызовы между сервисами — gRPC на порту 9090 внутри сети: корзина спрашивает
  # у каталога ресторан и блюдо; каталог и сервис заказов у identity-service — права
  # на ресторан; монолит у сервиса заказов — заказы и доставки для отзывов, рекомендаций
  # и трека. Оплата — асинхронно, сагой через Kafka: команды и исходы.
  #
  # Токены подписывает только identity-service закрытым RSA-ключом. Остальные проверяют их
  # открытым ключом из его JWKS — общего секрета у сервисов больше нет.
  #
  # Внутри сети все слушают 8080 (API) и 8081 (actuator): у каждого контейнера своё сетевое
  # пространство, и одинаковые порты не конфликтуют. Различные порты по умолчанию в их
  # application.yml нужны только для запуска из IDE, где все сервисы делят localhost.
  #
  # Монолит и сервисы наружу не публикуются: снаружи в систему ведёт одна дверь — шлюз.
  #
  # Инфраструктура одинакова у всех и меняется раз в полгода — её удобно один раз описать
  # и забыть. Код сервиса меняется каждые пять минут, и цикл mvn package + docker build +
  # рестарт стоит около минуты против трёх секунд перезапуска из IDE, плюс нет отладчика.
  #
  # Контейнер при этом нужен: он проверяет, что образ собирается и стартует — то же самое
  # поедет в CI и на стенд. Поэтому не удалён, а спрятан:
  #   docker compose up -d                        — только инфраструктура
  #   docker compose --profile full up -d — весь стек
  insights-service:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-insights-service:${INSIGHTS_SERVICE_TAG:-${IMAGE_TAG:-main}}
    container_name: food-delivery-insights-service
    mem_limit: 640m
    restart: unless-stopped
    # По умолчанию Docker добивает контейнер через 10 секунд после SIGTERM. Приложение
    # завершается штатно и ждёт текущую работу до 20 секунд (spring.lifecycle
    # .timeout-per-shutdown-phase), поэтому запас здесь больше — иначе штатное завершение
    # обрывалось бы ровно так же, как без него, только незаметнее.
    stop_grace_period: 30s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    # Список, а не отображение: только в этой форме запись вида `- NEO4J_PASSWORD` без значения
    # означает «пробросить переменную, если она задана, и не задавать её иначе».
    # Значение Compose берёт из .env или из окружения оболочки.
    #
    # Запись `NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}` выглядит равнозначной, но ведёт себя иначе:
    # она всегда передаёт переменную, подставляя пустую строку. Для Spring пустая строка —
    # это заданное значение, и вместо понятной ошибки о незаданной переменной приложение
    # упало бы на пустом пароле.
    #
    # Форму ${VAR:?...} здесь применять нельзя: Compose разбирает весь файл целиком,
    # до отбора по профилям, и обязательная переменная сервиса под профилем full ломала бы
    # обычный `docker compose up` без приложения. Недостающие переменные ловит само
    # приложение — на старте, с указанием имени переменной.
    volumes:
      - food_delivery_grpc_certs:/certs:ro
    environment:
      # Основной базы у сервиса нет: отзывы — в MongoDB, граф — в Neo4j, витрина — в ClickHouse.
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      # gRPC-клиенты: каталог (название ресторана для GraphQL), сервис заказов (заказ для отзыва
      # и графа) и сервис пользователей (права на ресторан для аналитики).
      - CATALOG_GRPC_ADDRESS=static://catalog-service:9090
      - ORDER_GRPC_ADDRESS=static://order-service:9090
      - IDENTITY_GRPC_ADDRESS=static://identity-service:9090
      # Взаимный TLS на gRPC: свой сертификат (CN=insights-service) и CA, которому верить.
      - SPRING_PROFILES_ACTIVE=grpc-tls
      - GRPC_TLS_CERTIFICATE=file:/certs/insights-service.crt
      - GRPC_TLS_PRIVATE_KEY=file:/certs/insights-service.key
      - GRPC_TLS_CA=file:/certs/ca.crt
      # Внутри сети — внутренний листенер брокера.
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TZ=${TZ}
      # Трассы уходят в Tempo; без этих двух строк сервис трассирует, но никуда не отправляет.
      - TRACING_EXPORT_ENABLED=true
      - OTEL_TRACES_ENDPOINT=http://tempo:4318/v1/traces
      # Открытые ключи для проверки токенов — у сервиса пользователей. Секрета подписи у сервиса нет.
      - JWT_JWK_SET_URI=http://identity-service:8080/.well-known/jwks.json

      # Адреса трёх хранилищ сервиса. Проставлены всегда, а работают только вместе
      # с соответствующим STORE_*_ENABLED — сами по себе они ничего не включают.
      #
      # depends_on на эти сервисы намеренно нет: Compose отказывается стартовать, если
      # зависимость выключена профилем, и приложение перестало бы подниматься без профиля
      # stores. Порядок старта здесь обеспечивается иначе — сначала поднимают
      # инфраструктуру, потом приложение.
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - NEO4J_URI=bolt://neo4j:7687
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123

      # Выключатели и секреты хранилищ пробрасываются без значений: не заданы в .env —
      # применится значение по умолчанию из application.yml, то есть выключено.
      - STORE_MONGO_ENABLED
      - STORE_NEO4J_ENABLED
      - STORE_CLICKHOUSE_ENABLED
      - NEO4J_USERNAME
      - NEO4J_PASSWORD
      - CLICKHOUSE_DB
      - CLICKHOUSE_USER
      - CLICKHOUSE_PASSWORD
    # Портов наружу нет: запросы приходят через шлюз. Для отладки в обход шлюза insights-service
    # удобнее запускать из IDE — там он слушает localhost:8082.

  catalog-service:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-catalog-service:${CATALOG_SERVICE_TAG:-${IMAGE_TAG:-main}}
    container_name: food-delivery-catalog-service
    mem_limit: 640m
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres-provision:
        condition: service_completed_successfully
    volumes:
      - food_delivery_grpc_certs:/certs:ro
    environment:
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      - GRPC_PORT=9090
      # Права на рестораны знает сервис пользователей — каталог спрашивает его по gRPC.
      - IDENTITY_GRPC_ADDRESS=static://identity-service:9090
      # Взаимный TLS на gRPC: свой сертификат (CN=catalog-service) и CA, которому верить.
      - SPRING_PROFILES_ACTIVE=grpc-tls
      - GRPC_TLS_CERTIFICATE=file:/certs/catalog-service.crt
      - GRPC_TLS_PRIVATE_KEY=file:/certs/catalog-service.key
      - GRPC_TLS_CA=file:/certs/ca.crt
      - CATALOG_DB_HOST=postgres
      - CATALOG_DB_PORT=5432
      - CATALOG_DB_NAME=${CATALOG_DB_NAME:-catalog}
      - CATALOG_DB_USER
      - CATALOG_DB_PASSWORD
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Поиск переехал сюда вместе со своим выключателем.
      - ELASTIC_HOST=elasticsearch
      - ELASTIC_PORT=9200
      - STORE_ELASTICSEARCH_ENABLED
      # Фото блюд лежат в MinIO. Бакет сервис создаёт сам при первой записи, поэтому порядок
      # старта не важен: недоступное хранилище означает 503 на загрузку, а не падение каталога.
      - MEDIA_ENABLED=${MEDIA_ENABLED:-true}
      - MEDIA_ENDPOINT=http://minio:9000
      - MEDIA_ACCESS_KEY=${MINIO_ROOT_USER}
      - MEDIA_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - TZ=${TZ}
      # Трассы уходят в Tempo; без этих двух строк сервис трассирует, но никуда не отправляет.
      - TRACING_EXPORT_ENABLED=true
      - OTEL_TRACES_ENDPOINT=http://tempo:4318/v1/traces
      # Открытые ключи для проверки токенов — у сервиса пользователей. Секрета подписи у сервиса нет.
      - JWT_JWK_SET_URI=http://identity-service:8080/.well-known/jwks.json

  identity-service:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-identity-service:${IDENTITY_SERVICE_TAG:-${IMAGE_TAG:-main}}
    container_name: food-delivery-identity-service
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      postgres-provision:
        condition: service_completed_successfully
      # Журнал аудита уезжает в Kafka. Вход в систему от брокера не зависит — журнал
      # копится в таблице, — но стартовать без него незачем: в стеке он есть всегда.
      kafka:
        condition: service_healthy
    volumes:
      - food_delivery_grpc_certs:/certs:ro
    environment:
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      - GRPC_PORT=9090
      # Взаимный TLS на gRPC: свой сертификат (CN=identity-service) и CA, которому верить.
      - SPRING_PROFILES_ACTIVE=grpc-tls
      - GRPC_TLS_CERTIFICATE=file:/certs/identity-service.crt
      - GRPC_TLS_PRIVATE_KEY=file:/certs/identity-service.key
      - GRPC_TLS_CA=file:/certs/ca.crt
      - IDENTITY_DB_HOST=postgres
      - IDENTITY_DB_PORT=5432
      - IDENTITY_DB_NAME=${IDENTITY_DB_NAME:-identity}
      - IDENTITY_DB_USER
      - IDENTITY_DB_PASSWORD
      # Закрытый ключ подписи токенов. Есть только у этого сервиса — в этом весь смысл RS256.
      - JWT_PRIVATE_KEY
      - JWT_KEY_ID
      - JWT_ACCESS_TOKEN_TTL=${JWT_ACCESS_TOKEN_TTL:-PT15M}
      - JWT_REFRESH_TOKEN_TTL=${JWT_REFRESH_TOKEN_TTL:-P30D}
      - APP_ADMIN_EMAIL
      - APP_ADMIN_PASSWORD
      # Вход через Keycloak (профиль auth): токен Keycloak обменивается на токен платформы. Издатель - адрес,
      # по которому Keycloak виден клиентам (он записан в токенах); ключи сервис берёт изнутри сети Docker.
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_ISSUER=http://localhost:${KEYCLOAK_PORT:-8180}/realms/food-delivery
      - OIDC_JWK_SET_URI=http://keycloak:8080/realms/food-delivery/protocol/openid-connect/certs
      - OIDC_CLIENT_IDS=food-delivery-web
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TZ=${TZ}
      # Трассы уходят в Tempo; без этих двух строк сервис трассирует, но никуда не отправляет.
      - TRACING_EXPORT_ENABLED=true
      - OTEL_TRACES_ENDPOINT=http://tempo:4318/v1/traces

  order-service:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-order-service:${ORDER_SERVICE_TAG:-${IMAGE_TAG:-main}}
    container_name: food-delivery-order-service
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      postgres-provision:
        condition: service_completed_successfully
    volumes:
      - food_delivery_grpc_certs:/certs:ro
    environment:
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      - GRPC_PORT=9090
      # gRPC-клиенты: каталог (ресторан и блюдо для корзины) и сервис пользователей (права на ресторан).
      - CATALOG_GRPC_ADDRESS=static://catalog-service:9090
      - IDENTITY_GRPC_ADDRESS=static://identity-service:9090
      # Взаимный TLS на gRPC: свой сертификат (CN=order-service) и CA, которому верить.
      - SPRING_PROFILES_ACTIVE=grpc-tls
      - GRPC_TLS_CERTIFICATE=file:/certs/order-service.crt
      - GRPC_TLS_PRIVATE_KEY=file:/certs/order-service.key
      - GRPC_TLS_CA=file:/certs/ca.crt
      - ORDER_DB_HOST=postgres
      - ORDER_DB_PORT=5432
      - ORDER_DB_NAME=${ORDER_DB_NAME:-orders}
      - ORDER_DB_USER
      - ORDER_DB_PASSWORD
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Сколько заказ ждёт оплаты, прежде чем отмениться сам.
      - PAYMENT_TIMEOUT=${PAYMENT_TIMEOUT:-PT15M}
      - TZ=${TZ}
      # Трассы уходят в Tempo; без этих двух строк сервис трассирует, но никуда не отправляет.
      - TRACING_EXPORT_ENABLED=true
      - OTEL_TRACES_ENDPOINT=http://tempo:4318/v1/traces
      - JWT_JWK_SET_URI=http://identity-service:8080/.well-known/jwks.json

  payment-service:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-payment-service:${PAYMENT_SERVICE_TAG:-${IMAGE_TAG:-main}}
    container_name: food-delivery-payment-service
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    # Ни одного синхронного соседа: команды приходят из Kafka, исходы уходят туда же.
    depends_on:
      kafka:
        condition: service_healthy
      postgres-provision:
        condition: service_completed_successfully
    environment:
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      - PAYMENT_DB_HOST=postgres
      - PAYMENT_DB_PORT=5432
      - PAYMENT_DB_NAME=${PAYMENT_DB_NAME:-payments}
      - PAYMENT_DB_USER
      - PAYMENT_DB_PASSWORD
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Платёжный шлюз: simulated (заглушка, по умолчанию) или stripe. Со stripe нужен STRIPE_API_KEY
      # (sk_test_… для теста); без ключа сервис не стартует. Подробности — в README payment-service.
      - PAYMENT_GATEWAY=${PAYMENT_GATEWAY:-simulated}
      - STRIPE_API_KEY
      - STRIPE_CURRENCY=${STRIPE_CURRENCY:-usd}
      # Пересчёт суммы заказа (рубли) в валюту провайдера по курсу ЦБ РФ, SOAP DailyInfo. Нужен выход в интернет.
      - FX_ENABLED=${FX_ENABLED:-false}
      - TZ=${TZ}
      # Трассы уходят в Tempo; без этих двух строк сервис трассирует, но никуда не отправляет.
      - TRACING_EXPORT_ENABLED=true
      - OTEL_TRACES_ENDPOINT=http://tempo:4318/v1/traces
      - JWT_JWK_SET_URI=http://identity-service:8080/.well-known/jwks.json

  tracking-service:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-tracking-service:${TRACKING_SERVICE_TAG:-${IMAGE_TAG:-main}}
    container_name: food-delivery-tracking-service
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      cassandra:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - food_delivery_grpc_certs:/certs:ro
    environment:
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      # Чей заказ и чья доставка — спрашивает у сервиса заказов по gRPC.
      - ORDER_GRPC_ADDRESS=static://order-service:9090
      - SPRING_PROFILES_ACTIVE=grpc-tls
      - GRPC_TLS_CERTIFICATE=file:/certs/tracking-service.crt
      - GRPC_TLS_PRIVATE_KEY=file:/certs/tracking-service.key
      - GRPC_TLS_CA=file:/certs/ca.crt
      - CASSANDRA_CONTACT_POINTS=cassandra:9042
      # Живой трек: подписки держит RabbitMQ через свой STOMP-плагин, а не память процесса.
      - TRACKING_RELAY_ENABLED=true
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_STOMP_PORT=61613
      - RABBITMQ_USER
      - RABBITMQ_PASSWORD
      - TRACKING_ALLOWED_ORIGINS=${TRACKING_ALLOWED_ORIGINS:-http://localhost:*}
      - TZ=${TZ}
      # Трассы уходят в Tempo; без этих двух строк сервис трассирует, но никуда не отправляет.
      - TRACING_EXPORT_ENABLED=true
      - OTEL_TRACES_ENDPOINT=http://tempo:4318/v1/traces
      - JWT_JWK_SET_URI=http://identity-service:8080/.well-known/jwks.json

  notification-service:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-notification-service:${NOTIFICATION_SERVICE_TAG:-${IMAGE_TAG:-main}}
    container_name: food-delivery-notification-service
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      grpc-certs:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres-provision:
        # База сервиса существует только после того, как отработал провижининг.
        condition: service_completed_successfully
      # Почта: письмо принимает Mailpit. Не ждём его здоровья — недоступный SMTP означает повтор
      # уведомления через очередь, а не отказ сервиса.
      mailpit:
        condition: service_started
    volumes:
      - food_delivery_grpc_certs:/certs:ro
    environment:
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      - NOTIFICATION_DB_HOST=postgres
      - NOTIFICATION_DB_PORT=5432
      - NOTIFICATION_DB_NAME=${NOTIFICATION_DB_NAME:-notification}
      - NOTIFICATION_DB_USER
      - NOTIFICATION_DB_PASSWORD
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # Рассылка идёт через очереди RabbitMQ: по очереди на канал, повторы через TTL.
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER
      - RABBITMQ_PASSWORD
      # Адрес получателя — у identity-service по gRPC; канал защищён взаимным TLS, сервис пускают
      # по имени из сертификата (notification-service в allowed-clients identity-service).
      - IDENTITY_GRPC_ADDRESS=static://identity-service:9090
      - SPRING_PROFILES_ACTIVE=grpc-tls
      - GRPC_TLS_CERTIFICATE=file:/certs/notification-service.crt
      - GRPC_TLS_PRIVATE_KEY=file:/certs/notification-service.key
      - GRPC_TLS_CA=file:/certs/ca.crt
      # Настоящая доставка по e-mail. false — письма уходят «в лог», как раньше.
      # Уведомления в Telegram. Выключено, пока не задан бот: TELEGRAM_ENABLED=true, TELEGRAM_BOT_TOKEN
      # (от @BotFather — секрет, передаётся только если задан) и TELEGRAM_BOT_USERNAME. Опрос бота
      # ведёт один экземпляр; при нескольких репликах на остальных TELEGRAM_POLLING_ENABLED=false.
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_BOT_USERNAME
      - TELEGRAM_POLLING_ENABLED=${TELEGRAM_POLLING_ENABLED:-true}
      - EMAIL_ENABLED=${EMAIL_ENABLED:-true}
      - EMAIL_FROM=${EMAIL_FROM:-no-reply@food-delivery.local}
      - MAIL_HOST=${MAIL_HOST:-mailpit}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - TZ=${TZ}
      # Трассы уходят в Tempo; без этих двух строк сервис трассирует, но никуда не отправляет.
      - TRACING_EXPORT_ENABLED=true
      - OTEL_TRACES_ENDPOINT=http://tempo:4318/v1/traces
      # Открытые ключи для проверки токенов — у сервиса пользователей. Секрета подписи у сервиса нет.
      - JWT_JWK_SET_URI=http://identity-service:8080/.well-known/jwks.json

  api-gateway:
    profiles: ["full"]
    image: ghcr.io/dima77726/food-delivery-api-gateway:${API_GATEWAY_TAG:-${IMAGE_TAG:-main}}
    container_name: food-delivery-api-gateway
    mem_limit: 384m
    restart: unless-stopped
    stop_grace_period: 30s
    # depends_on на сервисы приложения намеренно нет. Шлюз не нуждается в них для старта:
    # недоступный сервис означает 503 на его маршрутах, а не упавший шлюз. Ровно так это и
    # должно работать в бою — один лежащий сервис не роняет вход в систему целиком.
    # Redis — другое дело: он инфраструктура, и ограничитель частоты без него не считает.
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - SERVER_PORT=8080
      - MANAGEMENT_PORT=8081
      - INSIGHTS_SERVICE_URL=http://insights-service:8080
      - CATALOG_SERVICE_URL=http://catalog-service:8080
      # Фото блюд (/media/**) шлюз читает прямо из бакета.
      - MEDIA_STORAGE_URL=http://minio:9000
      - IDENTITY_SERVICE_URL=http://identity-service:8080
      - NOTIFICATION_SERVICE_URL=http://notification-service:8080
      - ORDER_SERVICE_URL=http://order-service:8080
      - PAYMENT_SERVICE_URL=http://payment-service:8080
      - TRACKING_SERVICE_URL=http://tracking-service:8080
      - TRACKING_WS_URL=ws://tracking-service:8080
      # Ограничение частоты запросов по адресу клиента; счётчики лежат в Redis.
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=${TZ}
      # Трассы уходят в Tempo; без этих двух строк сервис трассирует, но никуда не отправляет.
      - TRACING_EXPORT_ENABLED=true
      - OTEL_TRACES_ENDPOINT=http://tempo:4318/v1/traces
    ports:
      # Единственный опубликованный порт приложения. Служебный 8081 остаётся внутри сети
      # compose: снимать метрики может Prometheus, а снаружи их не видно.
      - "${APP_PORT:-8080}:8080"

  # --- Пять дополнительных хранилищ ---------------------------------------------------------
  #
  # Все под профилем stores: обычный `docker compose up -d` их не поднимает. Вместе они
  # занимают около пяти гигабайт памяти, а нужны только тем модулям, которые с ними работают.
  #
  #   docker compose --profile stores up -d          — инфраструктура плюс эти пять
  #   docker compose --profile stores --profile full up -d   — вообще всё
  #
  # Одного профиля мало: в .env нужно ещё выставить STORE_*_ENABLED=true, иначе приложение
  # поднимется без этих модулей. Разделение намеренное — контейнер можно держать поднятым,
  # а модуль выключенным, и наоборот нельзя: включённый модуль требует доступного сервера.
  #
  # Ограничения памяти у Java-сервисов (Elasticsearch, Cassandra, Neo4j) выставлены явно.
  # По умолчанию каждый из них берёт долю от памяти хоста и на машине с 32 ГБ забирает
  # несколько гигабайт под кучу, которую локальному стеку девать некуда.

  mongo:
    profiles: ["stores"]
    image: mongo:8.0
    container_name: food-delivery-mongo
    mem_limit: 512m
    restart: unless-stopped
    # Аутентификация не включена намеренно: это локальный стек, наружу он не смотрит,
    # а строка подключения в application.yml остаётся без пароля и не просит секрета
    # в репозитории. В любом другом окружении MONGO_INITDB_ROOT_* обязательны.
    environment:
      TZ: ${TZ}
    volumes:
      - food_delivery_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${MONGO_PORT:-27017}:27017"

  # Трек курьера. Единственное хранилище tracking-service и обязательное для него, поэтому
  # поднимается и с профилем full, а не только с stores.
  cassandra:
    profiles: ["stores", "full"]
    image: cassandra:5.0
    container_name: food-delivery-cassandra
    mem_limit: 1536m
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: food-delivery
      # Имя дата-центра должно совпадать с app.stores.cassandra.local-datacenter.
      # Драйвер 4.x требует его явно и при расхождении не находит ни одного узла:
      # ошибка выглядит как "no node was available", хотя узел работает.
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      TZ: ${TZ}
    volumes:
      - food_delivery_cassandra_data:/var/lib/cassandra
    # Cassandra поднимается заметно дольше остальных: старт занимает около минуты,
    # поэтому и start_period большой. Проверка через nodetool, а не через cqlsh:
    # cqlsh требует Python в контейнере и отвечает позже, чем узел начинает работать.
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep -q ^UN || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"

  neo4j:
    profiles: ["stores"]
    image: neo4j:5.26
    container_name: food-delivery-neo4j
    mem_limit: 1g
    restart: unless-stopped
    environment:
      # Пароль обязателен: без NEO4J_AUTH образ требует сменить пароль при первом входе,
      # и драйвер получает отказ, не объясняющий причины.
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
      TZ: ${TZ}
    volumes:
      - food_delivery_neo4j_data:/data
    healthcheck:
      # wget, а не curl: в образе neo4j curl не установлен, и проверка на нём всегда
      # возвращала бы "curl: not found" — контейнер вечно unhealthy при живой базе.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      # 7474 — веб-интерфейс с окном запросов Cypher, 7687 — сам протокол bolt.
      # Интерфейс полезен ровно так же, как Kafka UI: граф удобнее один раз увидеть.
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"

  clickhouse:
    profiles: ["stores"]
    image: clickhouse/clickhouse-server:25.3
    container_name: food-delivery-clickhouse
    mem_limit: 1280m
    restart: unless-stopped
    environment:
      # Без явно заданной учётной записи образ закрывает сетевой доступ для default.
      # Эти локальные значения совпадают с настройками приложения; переопределяются в .env.
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-food_delivery}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      TZ: ${TZ}
    # ClickHouse открывает много файлов одновременно и с лимитом по умолчанию
    # пишет в лог предупреждение на каждом запуске.
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - food_delivery_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --database \"$$CLICKHOUSE_DB\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      # 8123 — HTTP-интерфейс, по нему и ходит JDBC-драйвер.
      - "${CLICKHOUSE_PORT:-8123}:8123"

  elasticsearch:
    profiles: ["stores"]
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: food-delivery-elasticsearch
    mem_limit: 1g
    restart: unless-stopped
    environment:
      # Один узел: кворум мастеров для локального стека не нужен и не соберётся.
      discovery.type: single-node
      # Безопасность выключена намеренно. С ней образ поднимается по HTTPS с самоподписанным
      # сертификатом и требует пароль, то есть в приложение пришлось бы тащить truststore
      # ради локальной разработки. Вне локального стека так делать нельзя.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: ${TZ}
    volumes:
      - food_delivery_elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      # Проверяется только то, что кластер отвечает. Ждать статуса green бессмысленно:
      # на одном узле реплики разместить негде, и он остаётся жёлтым навсегда.
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    ports:
      - "${ELASTIC_PORT:-9200}:9200"

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: food-delivery-prometheus
    mem_limit: 384m
    restart: unless-stopped
    # depends_on на сервисы приложения убран намеренно. Compose отказывается стартовать, если зависимость
    # выключена профилем, а Prometheus в приложении и не нуждается: недоступный таргет
    # он показывает как DOWN и продолжает работать.
    extra_hosts:
      # На Docker Desktop host.docker.internal резолвится сам, на Linux — нет.
      # Эта строка делает конфигурацию одинаковой на всех машинах.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - food_delivery_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 15 дней истории: локальному стеку больше незачем, а диск не резиновый.
      - --storage.tsdb.retention.time=15d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  # Трассы. Принимает OTLP от сервисов (4318 по HTTP), хранит на диске, отдаёт Grafana.
  # Наружу не публикуется: смотреть трассы нужно в Grafana, а сервисам хватает сети compose.
  tempo:
    image: grafana/tempo:2.7.2
    container_name: food-delivery-tempo
    mem_limit: 384m
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - food_delivery_tempo_data:/var/tempo
    ports:
      # Только для сервисов, запущенных из IDE: контейнерам хватает сети compose.
      - "127.0.0.1:${TEMPO_OTLP_PORT:-4318}:4318"

  # Логи. Хранилище строк, индексируются только метки (сервис), а не содержимое: поэтому оно
  # легче Elasticsearch и укладывается в локальный бюджет памяти.
  loki:
    image: grafana/loki:3.4.2
    container_name: food-delivery-loki
    mem_limit: 384m
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - food_delivery_loki_data:/loki

  # Сборщик логов: читает stdout контейнеров через сокет Docker и пишет в Loki.
  # Сокет — только на чтение: Alloy видит список контейнеров и их вывод, но не управляет ими.
  alloy:
    image: grafana/alloy:v1.7.5
    container_name: food-delivery-alloy
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      - loki
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Локальный приёмник писем: принимает SMTP (1025) и показывает письма в интерфейсе (8025).
  # Наружу ничего не отправляет, поэтому настоящие уведомления можно проверять, не рискуя
  # написать живому человеку. Письма живут в памяти и пропадают с контейнером.
  # Keycloak: форма входа, подтверждение почты, защита от перебора, при желании второй фактор и соцсети.
  # Платформа владеет пользователями и ролями сама; Keycloak лишь опознаёт человека, а identity-service
  # обменивает его токен на токен платформы (POST /api/v1/auth/oidc). Режим start-dev: встроенная база в томе,
  # без HTTPS - для локальной работы. Realm (клиенты, роли, настройки) загружается из keycloak/.
  # Профиль auth, около 700 МБ памяти: включайте, когда нужен вход через Keycloak.
  keycloak:
    profiles: ["auth"]
    image: quay.io/keycloak/keycloak:26.4
    container_name: food-delivery-keycloak
    mem_limit: 768m
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN:-admin}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HTTP_PORT=8080
      # Адрес для клиентов; он же издатель в токенах. Изнутри сети Keycloak отвечает и по своему имени.
      - KC_HOSTNAME=http://localhost:${KEYCLOAK_PORT:-8180}
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
      # Куча ограничена: по умолчанию JVM взяла бы заметно больше, чем нужно для разработки.
      - JAVA_OPTS_KC_HEAP=-Xms192m -Xmx448m
    volumes:
      - ./keycloak/food-delivery-realm.json:/opt/keycloak/data/import/food-delivery-realm.json:ro
      - food_delivery_keycloak_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"

  mailpit:
    profiles: ["full"]
    image: axllent/mailpit:v1.21
    container_name: food-delivery-mailpit
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # Хранилище фото блюд (S3-совместимое). Официальные образы minio/minio сняты с публикации,
  # поэтому берётся сборка Chainguard. Бакет menu-images и политику «анонимное чтение» создаёт
  # каталог. Наружу — только консоль на localhost; фото снаружи читают через шлюз по /media/.
  minio:
    profiles: ["full"]
    image: cgr.dev/chainguard/minio:latest
    container_name: food-delivery-minio
    mem_limit: 256m
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
    volumes:
      - food_delivery_minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"

  grafana:
    image: grafana/grafana:11.5.1
    container_name: food-delivery-grafana
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      - prometheus
      - tempo
      - loki
    environment:
      # Пароль администратора Grafana. Значения по умолчанию нет намеренно: admin/admin
      # в файле репозитория — это тот же захардкоженный пароль, только привычный.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?задайте GRAFANA_PASSWORD в .env}
      # Дашборд и источник данных приезжают провижинингом, поэтому мастер первого запуска
      # только мешает.
      - GF_USERS_ALLOW_SIGN_UP=false
      # Алерты уходят письмом в Mailpit (контактная точка provisioning/alerting/contact-points.yml).
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=mailpit:1025
      - GF_SMTP_FROM_ADDRESS=alerts@food-delivery.local
      - GF_SMTP_FROM_NAME=Food Delivery Alerts
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - food_delivery_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  food_delivery_postgres_data:
  food_delivery_kafka_data:
  food_delivery_rabbitmq_data:
  food_delivery_redis_data:
  food_delivery_prometheus_data:
  food_delivery_grafana_data:
  food_delivery_tempo_data:
  food_delivery_loki_data:
  # Встроенная база Keycloak (режим start-dev): пользователи и сессии. Realm восстанавливается из keycloak/.
  food_delivery_keycloak_data:
  # Фото блюд. Единственные данные без второго источника, кроме баз: бэкапить вместе с PostgreSQL.
  food_delivery_minio_data:
  # Сертификаты mTLS. Не данные — их можно удалить, и grpc-certs выпустит новые.
  food_delivery_grpc_certs:
  # Тома дополнительных хранилищ объявлены безусловно: список томов профилями
  # не управляется, а неиспользованный том места не занимает.
  #
  # Три из этих четырёх содержат производные данные — витрину аналитики, граф рекомендаций
  # и поисковый индекс. Их можно удалить целиком (docker compose down -v), и они построятся
  # заново из PostgreSQL и Kafka. Отзывы в MongoDB и трек в Cassandra так не восстановятся:
  # это единственные данные вне PostgreSQL, у которых нет второго источника.
  food_delivery_mongo_data:
  food_delivery_cassandra_data:
  food_delivery_neo4j_data:
  food_delivery_clickhouse_data:
  food_delivery_elasticsearch_data:
