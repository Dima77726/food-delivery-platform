spring:
  application:
    name: food-delivery-platform

  lifecycle:
    # Сколько ждать завершения текущей работы при graceful shutdown. По умолчанию 30 секунд,
    # и это больше, чем ждёт Docker: он шлёт SIGKILL через 10 секунд после SIGTERM, так что
    # штатное завершение просто не успевало бы закончиться. Двадцать секунд согласованы
    # с stop_grace_period в docker-compose.yml — правьте их вместе.
    timeout-per-shutdown-phase: 20s

  datasource:
    # currentSchema задаёт search_path сразу после установки соединения, поэтому SQL в коде
    # пишется без префикса схемы. public оставлен вторым: там по умолчанию живут расширения
    # PostgreSQL (uuid-ossp, pgcrypto), и без него они перестали бы резолвиться.
    # Хост вынесен в переменную: локально это localhost, внутри docker-compose — имя сервиса
    # postgres. Без этого приложение в контейнере искало бы базу внутри самого себя.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:food_delivery}?currentSchema=${APP_SCHEMA:food_app},public
    username: ${POSTGRES_USER:food_user}
    password: ${POSTGRES_PASSWORD:food_password}
    driver-class-name: org.postgresql.Driver

    hikari:
      # Пул задан явно, хотя значения близки к умолчанию. Смысл в том, чтобы размер был
      # осознанным: соединение одновременно держат веб-потоки, два слушателя Kafka
      # и планировщик. Десяти хватает на фон и на разумную веб-нагрузку, при этом
      # несколько экземпляров приложения умещаются в max_connections PostgreSQL,
      # где по умолчанию всего 100 на всех.
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Пул фиксированного размера: minimum-idle равен максимуму. Пул, который сжимается
      # в простое, платит за это установкой соединения на первом же запросе после паузы —
      # а это как раз момент, когда пользователь ждёт ответа.
      minimum-idle: ${DB_POOL_SIZE:10}
      # Тридцать секунд по умолчанию — это ожидание свободного соединения. Для HTTP-запроса
      # столько ждать бессмысленно: клиент уже отвалится по своему таймауту, а поток
      # останется занятым. Лучше быстро вернуть ошибку.
      connection-timeout: 3000
      # Соединение, не возвращённое в пул за 20 секунд, — почти наверняка утечка.
      # Hikari напишет об этом в лог со стектрейсом места, где оно было взято.
      # Стоит недорого, а ловит ровно ту ошибку, из-за которой пул исчерпывается
      # под нагрузкой и приложение встаёт целиком.
      leak-detection-threshold: 20000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Небольшой таймаут намеренно. Кэш обязан быть быстрее базы; если Redis отвечает
      # дольше, ждать его бессмысленно — быстрее сходить в PostgreSQL. Значение по умолчанию
      # в Lettuce — минута, и при недоступном Redis каждый запрос витрины висел бы минуту.
      timeout: 500ms
      connect-timeout: 500ms

  cache:
    type: redis

  kafka:
    # По умолчанию — localhost:9094, внешний листенер брокера. Так приложение из IDE
    # достучится до Kafka в контейнере без единой правки. Внутри compose переменная
    # переопределяется на kafka:9092.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

    producer:
      # acks=all — подтверждение только после записи на все синхронизированные реплики.
      # Со значением 1 сообщение теряется при падении лидера сразу после подтверждения,
      # а для событий заказа потеря недопустима.
      acks: all
      properties:
        # Идемпотентный продюсер: при повторной отправке из-за таймаута брокер распознаёт
        # дубликат по номеру последовательности и не пишет его второй раз.
        enable.idempotence: true
        # Больше пяти при включённой идемпотентности брокер не разрешает: иначе он не сможет
        # восстановить порядок сообщений внутри партиции после повтора.
        max.in.flight.requests.per.connection: 5

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:food-delivery-notifications}
      # earliest, а не latest: новый экземпляр обязан прочитать всё, что накопилось,
      # а не начать с текущего момента, потеряв события за время простоя.
      auto-offset-reset: earliest
      properties:
        # Ограничивает объём работы между обращениями к брокеру. При слишком большой пачке
        # обработка не укладывается в max.poll.interval.ms, и брокер исключает потребителя
        # из группы, считая его зависшим.
        max.poll.records: 50

    listener:
      # Офсет фиксируется после каждого сообщения. Дороже по количеству коммитов, зато
      # при падении переобрабатывается одно сообщение, а не вся пачка.
      ack-mode: record

  jpa:
    # Диалект задан явно, хотя Hibernate умеет определять его сам. Определяет он его,
    # открывая соединение и читая метаданные JDBC, — то есть приложение лезет в базу
    # ещё до того, как ему это понадобилось. С явным значением старт не зависит от
    # доступности базы в этот момент и происходит на один round-trip быстрее.
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      # Схемой владеет Liquibase, и только он. validate означает: на старте Hibernate сверяет
      # свои сущности с реальными таблицами и падает при расхождении, но сам ничего не меняет.
      # update здесь был бы прямым вредительством — он правил бы схему в обход миграций,
      # и на разных стендах она разъехалась бы молча.
      ddl-auto: validate

    # Выключено намеренно, потому что значение по умолчанию — true. С open-in-view Spring
    # держит EntityManager открытым до конца отрисовки ответа, и ленивые связи подгружаются
    # уже в контроллере: запросы уходят в базу после того, как транзакция закрыта. N+1
    # при этом перестаёт быть виден в сервисе и всплывает нагрузкой на проде.
    open-in-view: false

    properties:
      hibernate:
        # Та же схема, что у datasource и Liquibase, но заданная явно. Hibernate не читает
        # currentSchema из JDBC-URL: без этого свойства валидатор искал бы таблицы
        # по метаданным во всех схемах сразу и результат зависел бы от драйвера.
        default_schema: ${APP_SCHEMA:food_app}
        jdbc:
          # Без batch_size Hibernate шлёт по одному INSERT на строку.
          batch_size: 50
        # Разрешают Hibernate переупорядочить операции перед отправкой. Без них пачка
        # собирается только из подряд идущих однотипных запросов, то есть почти никогда.
        order_inserts: true
        order_updates: true

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/changelog.yml
    # Liquibase намеренно не полагается на search_path: миграции обязаны быть явными.
    default-schema: ${APP_SCHEMA:food_app}
    liquibase-schema: ${LIQUIBASE_SCHEMA:liquibase_meta}
    parameters:
      appSchema: ${APP_SCHEMA:food_app}

app:
  outbox:
    # Пауза между разборами очереди. Две секунды — компромисс: событие доезжает до
    # потребителя почти сразу, а пустых запросов к базе немного.
    publish-interval: ${OUTBOX_PUBLISH_INTERVAL:PT2S}
    publish-enabled: ${OUTBOX_PUBLISH_ENABLED:true}

  security:
    # Первый администратор. Пустые значения по умолчанию — намеренно: без переменных окружения
    # учётка не создаётся вовсе, и в репозитории не оказывается ни одного пароля.
    bootstrap-admin:
      email: ${APP_ADMIN_EMAIL:}
      password: ${APP_ADMIN_PASSWORD:}
    jwt:
      # ВНИМАНИЕ: значение по умолчанию — только для локальной разработки.
      # JwtSecretValidator не даст приложению стартовать с ним под любым профилем, кроме dev/test.
      secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-any-real-environment}
      issuer: ${JWT_ISSUER:food-delivery-platform}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}

management:
  server:
    # Отдельный порт для служебных эндпоинтов — не косметика.
    # В docker-compose он не публикуется наружу, поэтому метрики и health доступны
    # только внутри сети, где живёт Prometheus. На одном порту с публичным API пришлось бы
    # либо открывать /actuator/prometheus всему интернету, либо городить аутентификацию
    # для скрейпера, у которого нет способа обновлять JWT.
    port: ${MANAGEMENT_PORT:8081}

  endpoints:
    web:
      exposure:
        # Перечислены поимённо. Значение * открыло бы и heapdump с threaddump —
        # дамп кучи содержит всё, что было в памяти, включая пароли из запросов.
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when-authorized
      probes:
        # Разделяет liveness и readiness: первый отвечает «процесс жив»,
        # второй — «готов принимать трафик». Перезапускать под из-за недоступной
        # базы не нужно, а вот убрать его из балансировки — нужно.
        enabled: true

  metrics:
    tags:
      # Общий тег на все метрики: без него метрики нескольких приложений
      # в одном Prometheus невозможно различить.
      application: ${spring.application.name}
    distribution:
      # Гистограммы по длительности HTTP-запросов, чтобы считались перцентили.
      # Без них доступен только средний отклик, а он скрывает как раз то,
      # что интересно: медленный хвост.
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

  # Значение по умолчанию — immediate: при SIGTERM приложение обрывает всё на середине.
  # Для этого сервиса это означает недообработанный запрос, слушателя Kafka, не успевшего
  # зафиксировать офсет, и публикатор outbox, остановленный между отправкой в брокер
  # и отметкой в базе. Dockerfile специально написан так, чтобы SIGTERM дошёл до JVM
  # (форма exec в ENTRYPOINT) — без graceful это старание пропадает впустую.
  shutdown: graceful

logging:
  # Отдельное свойство, а не переопределение всего шаблона: Boot подставляет correlation
  # в стандартный формат сам, и остальная его часть — цвета, обрезка имени класса —
  # остаётся нетронутой. Переписав шаблон целиком, это пришлось бы поддерживать руками.
  #
  # Прочерк вместо пустоты у обоих значений намеренный: строка лога из фонового потока
  # не имеет метки запроса, и по прочерку это видно сразу, а не выглядит сбоем разметки.
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-},%X{userId:-}] "

  level:
    root: INFO
    com.dima.fooddelivery: DEBUG
    liquibase: INFO
    net.lbruun.springboot.preliquibase: TRACE
