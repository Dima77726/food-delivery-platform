openapi: 3.0.3

# Источник истины для контракта Restaurant и Menu.
#
# Правило простое: сначала правится этот файл, потом код. Обратный порядок ломает саму
# идею — сгенерированные интерфейсы перестанут соответствовать спеке, и сборка это заметит.
#
# Остальные модули (Order, Payment, Delivery, Auth) пока живут в code-first: их контракт
# описывает springdoc по аннотациям. Перевод остальных сюда — отдельная задача.

info:
  title: Food Delivery Platform API
  version: v1
  description: |
    Контракт витрины ресторанов и управления меню.

    Витрина (`GET /restaurants`, `GET /restaurants/{id}/menu`) открыта без аутентификации.
    Всё остальное требует токена и прав управляющего конкретным рестораном.

servers:
  - url: http://localhost:8080
    description: Локальный запуск

tags:
  - name: Restaurant
    description: Витрина ресторанов и управление ими
  - name: MenuCatalog
    description: Меню для посетителя
  - name: MenuManagement
    description: Управление меню владельцем ресторана

paths:

  /api/v1/restaurants:
    get:
      tags: [Restaurant]
      operationId: listRestaurants
      summary: Список ресторанов
      security: []
      responses:
        '200':
          description: Список ресторанов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
    post:
      tags: [Restaurant]
      operationId: createRestaurant
      summary: Создать ресторан; создатель становится его управляющим
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRestaurantRequest'
      responses:
        '201':
          description: Ресторан создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/restaurants/{restaurantId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Restaurant]
      operationId: getRestaurant
      summary: Ресторан по идентификатору
      security: []
      responses:
        '200':
          description: Ресторан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Restaurant]
      operationId: updateRestaurant
      summary: Изменить данные ресторана; незаполненные поля не меняются
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRestaurantRequest'
      responses:
        '200':
          description: Ресторан обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/restaurants/{restaurantId}/open:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [Restaurant]
      operationId: openRestaurant
      summary: Открыть приём заказов
      responses:
        '200':
          description: Ресторан принимает заказы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/restaurants/{restaurantId}/close:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [Restaurant]
      operationId: closeRestaurant
      summary: Закрыть приём заказов; уже оформленные заказы это не отменяет
      responses:
        '200':
          description: Ресторан закрыт для новых заказов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/restaurants/{restaurantId}/menu:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [MenuCatalog]
      operationId: getRestaurantMenu
      summary: Меню ресторана для посетителя; архивные позиции сюда не попадают
      security: []
      responses:
        '200':
          description: Меню
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantMenu'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/restaurants/{restaurantId}/menu/manage:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [MenuManagement]
      operationId: getManagedMenu
      summary: Меню целиком, включая скрытые и архивные позиции
      responses:
        '200':
          description: Полное меню для владельца
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenu'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/restaurants/{restaurantId}/menu/categories:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [MenuManagement]
      operationId: createMenuCategory
      summary: Создать категорию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuCategoryRequest'
      responses:
        '201':
          description: Категория создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/restaurants/{restaurantId}/menu/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/CategoryId'
    patch:
      tags: [MenuManagement]
      operationId: updateMenuCategory
      summary: Переименовать категорию или изменить её порядок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuCategoryRequest'
      responses:
        '200':
          description: Категория обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [MenuManagement]
      operationId: archiveMenuCategory
      summary: >-
        Убрать категорию из меню вместе с её блюдами. Строки остаются в базе, потому что
        на них ссылаются позиции прошлых заказов; для клиента API это неотличимо от удаления.
      responses:
        '204':
          description: Категория убрана из меню
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/restaurants/{restaurantId}/menu/categories/{categoryId}/items:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/CategoryId'
    post:
      tags: [MenuManagement]
      operationId: createMenuItem
      summary: Добавить блюдо в категорию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuItemRequest'
      responses:
        '201':
          description: Блюдо создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/restaurants/{restaurantId}/menu/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/ItemId'
    patch:
      tags: [MenuManagement]
      operationId: updateMenuItem
      summary: >-
        Изменить блюдо. На существующие корзины и заказы не влияет: они хранят собственную
        копию цены на момент добавления.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuItemRequest'
      responses:
        '200':
          description: Блюдо обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [MenuManagement]
      operationId: archiveMenuItem
      summary: Убрать блюдо из меню навсегда
      responses:
        '204':
          description: Блюдо убрано из меню
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/restaurants/{restaurantId}/menu/items/{itemId}/in-stock:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [MenuManagement]
      operationId: markMenuItemInStock
      summary: Вернуть блюдо в продажу
      responses:
        '200':
          description: Блюдо снова доступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/restaurants/{restaurantId}/menu/items/{itemId}/out-of-stock:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [MenuManagement]
      operationId: markMenuItemOutOfStock
      summary: Временно скрыть блюдо — закончилось. Обратимо, в отличие от архивирования.
      responses:
        '200':
          description: Блюдо помечено как закончившееся
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:

  securitySchemes:
    bearer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Операция невозможна в текущем состоянии ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:

    ApiError:
      type: object
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string

    Restaurant:
      type: object
      required: [id, name, city, active]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        city:
          type: string
        active:
          type: boolean
          description: Принимает ли ресторан новые заказы

    CreateRestaurantRequest:
      type: object
      required: [name, city]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
          nullable: true
        city:
          type: string
          minLength: 1
          maxLength: 255

    UpdateRestaurantRequest:
      type: object
      description: Незаполненные поля не меняются
      properties:
        name:
          type: string
          maxLength: 255
          nullable: true
        description:
          type: string
          maxLength: 1000
          nullable: true
        city:
          type: string
          maxLength: 255
          nullable: true

    MenuItem:
      type: object
      required: [id, name, price, available]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          # Без format: генератор java отображает bare number в BigDecimal.
          # format: double дал бы Double, а деньги в double накапливают ошибку округления.
          type: number
        available:
          type: boolean
          description: Есть ли блюдо в наличии прямо сейчас

    MenuCategory:
      type: object
      required: [id, name, items]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    RestaurantMenu:
      type: object
      required: [restaurantId, categories]
      properties:
        restaurantId:
          type: integer
          format: int64
        categories:
          type: array
          items:
            $ref: '#/components/schemas/MenuCategory'

    ManagedMenuItem:
      type: object
      required: [id, categoryId, name, price, sortOrder, available, archived]
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          # Без format: генератор java отображает bare number в BigDecimal.
          # format: double дал бы Double, а деньги в double накапливают ошибку округления.
          type: number
        sortOrder:
          type: integer
          format: int32
        available:
          type: boolean
          description: Временно закончилось; обратимо
        archived:
          type: boolean
          description: Убрано из меню навсегда; необратимо

    ManagedMenuCategory:
      type: object
      required: [id, name, sortOrder, archived, items]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
        archived:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedMenuItem'

    ManagedMenu:
      type: object
      required: [restaurantId, categories]
      properties:
        restaurantId:
          type: integer
          format: int64
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ManagedMenuCategory'

    CreateMenuCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          nullable: true

    UpdateMenuCategoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          nullable: true
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          nullable: true

    CreateMenuItemRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 100
          nullable: true
        price:
          # Без format: генератор java отображает bare number в BigDecimal.
          # format: double дал бы Double, а деньги в double накапливают ошибку округления.
          type: number
          minimum: 0
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          nullable: true

    UpdateMenuItemRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          nullable: true
        description:
          type: string
          maxLength: 100
          nullable: true
        price:
          # Без format: генератор java отображает bare number в BigDecimal.
          # format: double дал бы Double, а деньги в double накапливают ошибку округления.
          type: number
          minimum: 0
          nullable: true
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          nullable: true

security:
  - bearer-jwt: []
