          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "description": "Требуется действительный JWT."
        "403":
          "$ref": "#/components/responses/Forbidden"

components:

  securitySchemes:
    bearer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RestaurantId:
      name: restaurantId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Операция невозможна в текущем состоянии ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:

    ApiError:
      type: object
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        path:
          type: string

    Restaurant:
      type: object
      required: [id, name, city, active]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        city:
          type: string
        active:
          type: boolean
          description: Принимает ли ресторан новые заказы

    CreateRestaurantRequest:
      type: object
      required: [name, city]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
          nullable: true
        city:
          type: string
          minLength: 1
          maxLength: 255

    UpdateRestaurantRequest:
      type: object
      description: Незаполненные поля не меняются
      properties:
        name:
          type: string
          maxLength: 255
          nullable: true
        description:
          type: string
          maxLength: 1000
          nullable: true
        city:
          type: string
          maxLength: 255
          nullable: true

    MenuItem:
      type: object
      required: [id, name, price, available]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          # Без format: генератор java отображает bare number в BigDecimal.
          # format: double дал бы Double, а деньги в double накапливают ошибку округления.
          type: number
        available:
          type: boolean
          description: Есть ли блюдо в наличии прямо сейчас

    MenuCategory:
      type: object
      required: [id, name, items]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'

    RestaurantMenu:
      type: object
      required: [restaurantId, categories]
      properties:
        restaurantId:
          type: integer
          format: int64
        categories:
          type: array
          items:
            $ref: '#/components/schemas/MenuCategory'

    ManagedMenuItem:
      type: object
      required: [id, categoryId, name, price, sortOrder, available, archived]
      properties:
        id:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          # Без format: генератор java отображает bare number в BigDecimal.
          # format: double дал бы Double, а деньги в double накапливают ошибку округления.
          type: number
        sortOrder:
          type: integer
          format: int32
        available:
          type: boolean
          description: Временно закончилось; обратимо
        archived:
          type: boolean
          description: Убрано из меню навсегда; необратимо

    ManagedMenuCategory:
      type: object
      required: [id, name, sortOrder, archived, items]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
        archived:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedMenuItem'

    ManagedMenu:
      type: object
      required: [restaurantId, categories]
      properties:
        restaurantId:
          type: integer
          format: int64
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ManagedMenuCategory'

    CreateMenuCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          nullable: true

    UpdateMenuCategoryRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          nullable: true
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          nullable: true

    CreateMenuItemRequest:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 100
          nullable: true
        price:
          # Без format: генератор java отображает bare number в BigDecimal.
          # format: double дал бы Double, а деньги в double накапливают ошибку округления.
          type: number
          minimum: 0
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          nullable: true

    UpdateMenuItemRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          nullable: true
        description:
          type: string
          maxLength: 100
          nullable: true
        price:
          # Без format: генератор java отображает bare number в BigDecimal.
          # format: double дал бы Double, а деньги в double накапливают ошибку округления.
          type: number
          minimum: 0
          nullable: true
        sortOrder:
          type: integer
          format: int32
          minimum: 0
          nullable: true

    "DishRatingRequest":
      "type": "object"
      "required":
        - "menuItemId"
        - "menuItemName"
        - "rating"
      "properties":
        "menuItemId":
          "type": "integer"
          "format": "int64"
          "minimum": 1
        "menuItemName":
          "type": "string"
          "minLength": 1
          "maxLength": 255
          "description": "Передаётся для совместимости; сервер сохраняет название из позиции заказа."
        "rating":
          "type": "integer"
          "format": "int32"
          "minimum": 1
          "maximum": 5
    "CreateReviewRequest":
      "type": "object"
      "required":
        - "rating"
      "properties":
        "rating":
          "type": "integer"
          "format": "int32"
          "minimum": 1
          "maximum": 5
        "comment":
          "type": "string"
          "maxLength": 2000
          "nullable": true
        "dishes":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/DishRatingRequest"
          "maxItems": 50
          "nullable": true
          "description": "Только блюда данного заказа, каждое не более одного раза."
        "tags":
          "type": "array"
          "items":
            "type": "string"
            "maxLength": 32
          "maxItems": 10
          "nullable": true
    "DishRatingResponse":
      "type": "object"
      "required":
        - "menuItemId"
        - "menuItemName"
        - "rating"
      "properties":
        "menuItemId":
          "type": "integer"
          "format": "int64"
        "menuItemName":
          "type": "string"
        "rating":
          "type": "integer"
          "format": "int32"
    "ReviewResponse":
      "type": "object"
      "required":
        - "id"
        - "orderId"
        - "restaurantId"
        - "customerId"
        - "rating"
        - "dishes"
        - "tags"
        - "createdAt"
      "properties":
        "id":
          "type": "string"
        "orderId":
          "type": "integer"
          "format": "int64"
        "restaurantId":
          "type": "integer"
          "format": "int64"
        "customerId":
          "type": "integer"
          "format": "int64"
        "rating":
          "type": "integer"
          "format": "int32"
        "comment":
          "type": "string"
          "nullable": true
        "dishes":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/DishRatingResponse"
        "tags":
          "type": "array"
          "items":
            "type": "string"
        "createdAt":
          "type": "string"
          "format": "date-time"
    "ReviewPageResponse":
      "type": "object"
      "required":
        - "content"
        - "page"
        - "size"
        - "totalElements"
        - "totalPages"
      "properties":
        "content":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/ReviewResponse"
        "page":
          "type": "integer"
          "format": "int32"
        "size":
          "type": "integer"
          "format": "int32"
        "totalElements":
          "type": "integer"
          "format": "int64"
        "totalPages":
          "type": "integer"
          "format": "int32"
    "TagCountResponse":
      "type": "object"
      "required":
        - "tag"
        - "count"
      "properties":
        "tag":
          "type": "string"
        "count":
          "type": "integer"
          "format": "int64"
    "RatingSummaryResponse":
      "type": "object"
      "required":
        - "restaurantId"
        - "total"
        - "average"
        - "histogram"
        - "topTags"
      "properties":
        "restaurantId":
          "type": "integer"
          "format": "int64"
        "total":
          "type": "integer"
          "format": "int64"
        "average":
          "type": "number"
          "format": "double"
        "histogram":
          "type": "object"
          "additionalProperties":
            "type": "integer"
            "format": "int64"
          "description": "Оценка от 1 до 5 в виде строкового ключа JSON."
        "topTags":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/TagCountResponse"
    "ReportPositionRequest":
      "type": "object"
      "required":
        - "latitude"
        - "longitude"
      "properties":
        "latitude":
          "type": "number"
          "format": "double"
          "minimum": -90
          "maximum": 90
        "longitude":
          "type": "number"
          "format": "double"
          "minimum": -180
          "maximum": 180
        "speedKmh":
          "type": "number"
          "format": "double"
          "minimum": 0
          "maximum": 300
          "nullable": true
    "PositionResponse":
      "type": "object"
      "required":
        - "deliveryId"
        - "courierId"
        - "recordedAt"
        - "latitude"
        - "longitude"
      "properties":
        "deliveryId":
          "type": "integer"
          "format": "int64"
        "courierId":
          "type": "integer"
          "format": "int64"
        "recordedAt":
          "type": "string"
          "format": "date-time"
        "latitude":
          "type": "number"
          "format": "double"
        "longitude":
          "type": "number"
          "format": "double"
        "speedKmh":
          "type": "number"
          "format": "double"
          "nullable": true
    "TrackResponse":
      "type": "object"
      "required":
        - "deliveryId"
        - "size"
        - "positions"
      "properties":
        "deliveryId":
          "type": "integer"
          "format": "int64"
        "size":
          "type": "integer"
          "format": "int32"
        "positions":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/PositionResponse"
    "RecommendedItemResponse":
      "type": "object"
      "required":
        - "menuItemId"
        - "name"
        - "restaurantId"
        - "score"
      "properties":
        "menuItemId":
          "type": "integer"
          "format": "int64"
        "name":
          "type": "string"
        "restaurantId":
          "type": "integer"
          "format": "int64"
        "score":
          "type": "integer"
          "format": "int64"
    "ProjectionResultResponse":
      "type": "object"
      "required":
        - "ordersRead"
      "properties":
        "ordersRead":
          "type": "integer"
          "format": "int32"
    "DailySalesResponse":
      "type": "object"
      "required":
        - "day"
        - "orders"
        - "revenue"
        - "averageCheck"
      "properties":
        "day":
          "type": "string"
          "format": "date"
        "orders":
          "type": "integer"
          "format": "int64"
        "revenue":
          "type": "number"
        "averageCheck":
          "type": "number"
    "SalesReportResponse":
      "type": "object"
      "required":
        - "from"
        - "to"
        - "totalOrders"
        - "totalRevenue"
        - "days"
      "properties":
        "restaurantId":
          "type": "integer"
          "format": "int64"
          "nullable": true
        "from":
          "type": "string"
          "format": "date"
        "to":
          "type": "string"
          "format": "date"
        "totalOrders":
          "type": "integer"
          "format": "int64"
        "totalRevenue":
          "type": "number"
        "days":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/DailySalesResponse"
    "StatusCountResponse":
      "type": "object"
      "required":
        - "status"
        - "orders"
      "properties":
        "status":
          "type": "string"
        "orders":
          "type": "integer"
          "format": "int64"
    "StatusFunnelResponse":
      "type": "object"
      "required":
        - "restaurantId"
        - "from"
        - "to"
        - "statuses"
      "properties":
        "restaurantId":
          "type": "integer"
          "format": "int64"
        "from":
          "type": "string"
          "format": "date"
        "to":
          "type": "string"
          "format": "date"
        "statuses":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/StatusCountResponse"
    "FoundRestaurant":
      "type": "object"
      "required":
        - "restaurantId"
        - "name"
        - "city"
        - "active"
      "properties":
        "restaurantId":
          "type": "integer"
          "format": "int64"
        "name":
          "type": "string"
        "description":
          "type": "string"
          "nullable": true
        "city":
          "type": "string"
        "active":
          "type": "boolean"
    "FoundMenuItem":
      "type": "object"
      "required":
        - "menuItemId"
        - "restaurantId"
        - "restaurantName"
        - "city"
        - "name"
        - "price"
        - "available"
      "properties":
        "menuItemId":
          "type": "integer"
          "format": "int64"
        "restaurantId":
          "type": "integer"
          "format": "int64"
        "restaurantName":
          "type": "string"
        "city":
          "type": "string"
        "name":
          "type": "string"
        "description":
          "type": "string"
          "nullable": true
        "price":
          "type": "number"
        "available":
          "type": "boolean"
    "SearchResponse":
      "type": "object"
      "required":
        - "restaurants"
        - "items"
      "properties":
        "query":
          "type": "string"
          "nullable": true
        "restaurants":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/FoundRestaurant"
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/FoundMenuItem"
    "ReindexResult":
      "type": "object"
      "required":
        - "restaurants"
        - "items"
        - "removed"
      "properties":
        "restaurants":
          "type": "integer"
          "format": "int32"
        "items":
          "type": "integer"
          "format": "int32"
        "removed":
          "type": "integer"
          "format": "int64"

security:
  - bearer-jwt: []
