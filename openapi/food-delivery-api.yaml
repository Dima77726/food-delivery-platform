openapi: 3.0.3

# Контракт Restaurant, Menu и пяти дополнительных модулей хранилищ.
#
# Правило простое: сначала правится этот файл, потом код. Обратный порядок ломает саму
# идею — сгенерированные интерфейсы перестанут соответствовать спеке, и сборка это заметит.
#
# Остальные модули (Order, Payment, Delivery, Auth) пока живут в code-first: их контракт
# описывает springdoc по аннотациям. Перевод остальных сюда — отдельная задача.

info:
  title: Food Delivery Platform API
  version: v1
  description: |
    Контракт ресторанов, меню, отзывов, трекинга, рекомендаций, аналитики и поиска.

    Витрина (`GET /restaurants`, `GET /restaurants/{id}/menu`) открыта без аутентификации.
    Поиск и чтение отзывов также публичны. Остальные операции требуют JWT и указанных прав.
    Пять дополнительных модулей включаются независимо через STORE_*_ENABLED.

servers:
  - url: http://localhost:8080
    description: Локальный запуск

tags:
  - name: Restaurant
    description: Витрина ресторанов и управление ими
  - name: MenuCatalog
    description: Меню для посетителя
  - name: MenuManagement
    description: Управление меню владельцем ресторана

  - name: Review
    description: Отзывы о заказах
  - name: Tracking
    description: Трек курьера
  - name: Recommendation
    description: Рекомендации по заказам
  - name: Analytics
    description: Отчёты о продажах
  - name: Search
    description: Поиск по витрине

paths:

  /api/v1/restaurants:
    get:
      tags: [Restaurant]
      operationId: listRestaurants
      summary: Список ресторанов
      security: []
      responses:
        '200':
          description: Список ресторанов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Restaurant'
    post:
      tags: [Restaurant]
      operationId: createRestaurant
      summary: Создать ресторан; создатель становится его управляющим
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRestaurantRequest'
      responses:
        '201':
          description: Ресторан создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/restaurants/{restaurantId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [Restaurant]
      operationId: getRestaurant
      summary: Ресторан по идентификатору
      security: []
      responses:
        '200':
          description: Ресторан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Restaurant]
      operationId: updateRestaurant
      summary: Изменить данные ресторана; незаполненные поля не меняются
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRestaurantRequest'
      responses:
        '200':
          description: Ресторан обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/restaurants/{restaurantId}/open:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [Restaurant]
      operationId: openRestaurant
      summary: Открыть приём заказов
      responses:
        '200':
          description: Ресторан принимает заказы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/restaurants/{restaurantId}/close:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [Restaurant]
      operationId: closeRestaurant
      summary: Закрыть приём заказов; уже оформленные заказы это не отменяет
      responses:
        '200':
          description: Ресторан закрыт для новых заказов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Restaurant'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/restaurants/{restaurantId}/menu:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [MenuCatalog]
      operationId: getRestaurantMenu
      summary: Меню ресторана для посетителя; архивные позиции сюда не попадают
      security: []
      responses:
        '200':
          description: Меню
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantMenu'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/restaurants/{restaurantId}/menu/manage:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    get:
      tags: [MenuManagement]
      operationId: getManagedMenu
      summary: Меню целиком, включая скрытые и архивные позиции
      responses:
        '200':
          description: Полное меню для владельца
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenu'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/restaurants/{restaurantId}/menu/categories:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
    post:
      tags: [MenuManagement]
      operationId: createMenuCategory
      summary: Создать категорию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuCategoryRequest'
      responses:
        '201':
          description: Категория создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/restaurants/{restaurantId}/menu/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/CategoryId'
    patch:
      tags: [MenuManagement]
      operationId: updateMenuCategory
      summary: Переименовать категорию или изменить её порядок
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuCategoryRequest'
      responses:
        '200':
          description: Категория обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuCategory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [MenuManagement]
      operationId: archiveMenuCategory
      summary: >-
        Убрать категорию из меню вместе с её блюдами. Строки остаются в базе, потому что
        на них ссылаются позиции прошлых заказов; для клиента API это неотличимо от удаления.
      responses:
        '204':
          description: Категория убрана из меню
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/restaurants/{restaurantId}/menu/categories/{categoryId}/items:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/CategoryId'
    post:
      tags: [MenuManagement]
      operationId: createMenuItem
      summary: Добавить блюдо в категорию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuItemRequest'
      responses:
        '201':
          description: Блюдо создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/restaurants/{restaurantId}/menu/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/ItemId'
    patch:
      tags: [MenuManagement]
      operationId: updateMenuItem
      summary: >-
        Изменить блюдо. На существующие корзины и заказы не влияет: они хранят собственную
        копию цены на момент добавления.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuItemRequest'
      responses:
        '200':
          description: Блюдо обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [MenuManagement]
      operationId: archiveMenuItem
      summary: Убрать блюдо из меню навсегда
      responses:
        '204':
          description: Блюдо убрано из меню
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/restaurants/{restaurantId}/menu/items/{itemId}/in-stock:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [MenuManagement]
      operationId: markMenuItemInStock
      summary: Вернуть блюдо в продажу
      responses:
        '200':
          description: Блюдо снова доступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/restaurants/{restaurantId}/menu/items/{itemId}/out-of-stock:
    parameters:
      - $ref: '#/components/parameters/RestaurantId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [MenuManagement]
      operationId: markMenuItemOutOfStock
      summary: Временно скрыть блюдо — закончилось. Обратимо, в отличие от архивирования.
      responses:
        '200':
          description: Блюдо помечено как закончившееся
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuItem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  "/api/v1/customers/{customerId}/orders/{orderId}/review":
    "post":
      "tags":
        - "Review"
      "operationId": "createReview"
      "summary": "Оставить отзыв о доставленном заказе"
      "description": "Маршрут доступен при включённом модуле Review. При выключенном модуле обработчик отсутствует. Клиент может оставить один отзыв о собственном доставленном заказе."
      "responses":
        "201":
          "description": "Оставить отзыв о доставленном заказе"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReviewResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "description": "Требуется действительный JWT."
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
      "parameters":
        -
          "name": "customerId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
        -
          "name": "orderId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/CreateReviewRequest"
  "/api/v1/restaurants/{restaurantId}/reviews":
    "get":
      "tags":
        - "Review"
      "operationId": "getRestaurantReviews"
      "summary": "Отзывы ресторана"
      "description": "Маршрут доступен при включённом модуле Review. При выключенном модуле обработчик отсутствует."
      "responses":
        "200":
          "description": "Отзывы ресторана"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ReviewPageResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
      "parameters":
        -
          "name": "restaurantId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
        -
          "name": "page"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "minimum": 0
            "default": 0
        -
          "name": "size"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "minimum": 1
            "maximum": 100
            "default": 20
      "security": []
  "/api/v1/restaurants/{restaurantId}/reviews/summary":
    "get":
      "tags":
        - "Review"
      "operationId": "getRestaurantRatingSummary"
      "summary": "Сводка оценок ресторана"
      "description": "Маршрут доступен при включённом модуле Review. При выключенном модуле обработчик отсутствует."
      "responses":
        "200":
          "description": "Сводка оценок ресторана"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/RatingSummaryResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
      "parameters":
        -
          "name": "restaurantId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
      "security": []
  "/api/v1/couriers/{courierId}/deliveries/{deliveryId}/positions":
    "post":
      "tags":
        - "Tracking"
      "operationId": "reportPosition"
      "summary": "Принята координата курьера"
      "description": "Маршрут доступен при включённом модуле Tracking. При выключенном модуле обработчик отсутствует. Только назначенный курьер, доставка в статусе PICKED_UP."
      "responses":
        "202":
          "description": "Принята координата курьера"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PositionResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "description": "Требуется действительный JWT."
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
      "parameters":
        -
          "name": "courierId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
        -
          "name": "deliveryId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/ReportPositionRequest"
  "/api/v1/couriers/{courierId}/deliveries/{deliveryId}/track":
    "get":
      "tags":
        - "Tracking"
      "operationId": "getCourierTrack"
      "summary": "Последние координаты доставки"
      "description": "Маршрут доступен при включённом модуле Tracking. При выключенном модуле обработчик отсутствует. Только назначенный курьер."
      "responses":
        "200":
          "description": "Последние координаты доставки"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/TrackResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "description": "Требуется действительный JWT."
        "403":
          "$ref": "#/components/responses/Forbidden"
      "parameters":
        -
          "name": "courierId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
        -
          "name": "deliveryId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
        -
          "name": "limit"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "minimum": 1
            "maximum": 1000
            "default": 100
  "/api/v1/customers/{customerId}/orders/{orderId}/track":
    "get":
      "tags":
        - "Tracking"
      "operationId": "getOrderTrack"
      "summary": "Последние координаты курьера по заказу"
      "description": "Маршрут доступен при включённом модуле Tracking. При выключенном модуле обработчик отсутствует. Только владелец заказа."
      "responses":
        "200":
          "description": "Последние координаты курьера по заказу"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/TrackResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "description": "Требуется действительный JWT."
        "403":
          "$ref": "#/components/responses/Forbidden"
      "parameters":
        -
          "name": "customerId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
        -
          "name": "orderId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
        -
          "name": "limit"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "minimum": 1
            "maximum": 1000
            "default": 100
  "/api/v1/customers/{customerId}/recommendations":
    "get":
      "tags":
        - "Recommendation"
      "operationId": "getRecommendations"
      "summary": "Персональные рекомендации"
      "description": "Маршрут доступен при включённом модуле Recommendation. При выключенном модуле обработчик отсутствует. Только собственные рекомендации."
      "responses":
        "200":
          "description": "Персональные рекомендации"
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/RecommendedItemResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "description": "Требуется действительный JWT."
        "403":
          "$ref": "#/components/responses/Forbidden"
      "parameters":
        -
          "name": "customerId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
        -
          "name": "limit"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "minimum": 1
            "maximum": 50
            "default": 10
  "/api/v1/menu-items/{menuItemId}/ordered-together":
    "get":
      "tags":
        - "Recommendation"
      "operationId": "getOrderedTogether"
      "summary": "Блюда, которые заказывают вместе"
      "description": "Маршрут доступен при включённом модуле Recommendation. При выключенном модуле обработчик отсутствует."
      "responses":
        "200":
          "description": "Блюда, которые заказывают вместе"
          "content":
            "application/json":
              "schema":
                "type": "array"
                "items":
                  "$ref": "#/components/schemas/RecommendedItemResponse"
        "400":
          "$ref": "#/components/responses/BadRequest"
        "404":
          "$ref": "#/components/responses/NotFound"
        "401":
          "description": "Требуется действительный JWT."
        "403":
          "$ref": "#/components/responses/Forbidden"
      "parameters":
        -
          "name": "menuItemId"
          "in": "path"
          "required": true
          "schema":
            "type": "integer"
            "format": "int64"
            "minimum": 1
        -
          "name": "limit"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "format": "int32"
            "minimum": 1
            "maximum": 50
            "default": 10
  "/api/v1/admin/recommendations/project":
    "post":
      "tags":
        - "Recommendation"
      "operationId": "projectNow"
      "summary": "Сверить одну пачку заказов"
