# Loki в одиночном режиме: логи контейнеров локального стека, хранение на диске.

auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Неделя — как и у трасс. Без предела логи растут, пока не кончится диск.
  retention_period: 168h
  # Формат логов Spring не структурирован, а метаданные (traceId и прочее) вытаскивает
  # Grafana по регулярному выражению, поэтому структурированные метаданные Loki не нужны.
  allow_structured_metadata: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
