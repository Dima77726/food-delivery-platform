# Tempo в одиночном режиме: трассы локального стека, хранение на диске.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Блок закрывается быстро: локально трасса нужна в поиске через секунды, а не через пять минут.
  max_block_duration: 30s

compactor:
  compaction:
    # Неделя истории — локальному стеку достаточно, диск не резиновый.
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
