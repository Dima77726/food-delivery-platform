# Куда уходят алерты. Локально — письмо в Mailpit (http://localhost:8025): наружу ничего не
# отправляется, секретов в файле нет. Для настоящих получателей добавьте точку Telegram или
# почты в Alerting → Contact points и переключите политику; токены в репозиторий не кладутся.

apiVersion: 1

contactPoints:
  - orgId: 1
    name: "mailpit"
    receivers:
      - uid: "mailpit-email"
        type: "email"
        settings:
          addresses: "alerts@food-delivery.local"
          singleEmail: true

policies:
  - orgId: 1
    receiver: "mailpit"
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
