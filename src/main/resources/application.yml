spring:
  application:
    name: food-delivery-platform
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
server:
  port: 8080

logging:
  level:
    root: info
    com.dima.fooddelivery: DEBUG
