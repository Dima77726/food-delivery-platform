// Кто управляет каким рестораном.
//
// Связь «пользователь — ресторан» принадлежит пользователю, а не ресторану: это факт
// о правах человека, такой же, как его роли. Поэтому владеет ею тот, кто владеет
// пользователями, — сейчас монолит, после третьего этапа — identity-service. Каталог
// и монолит спрашивают его, а не держат каждый свою копию: копии прав расходятся,
// и расхождение здесь — это доступ к чужому ресторану.
//
// Контракт переедет в identity-service вместе с реализацией, и потребители этого
// не заметят: меняется только адрес сервера.
syntax = "proto3";

package fooddelivery.identity.v1;

option java_multiple_files = true;
option java_package = "com.dima.fooddelivery.grpc.identity.v1";
option java_outer_classname = "RestaurantAccessProto";

service RestaurantAccessService {
  // Управляет ли пользователь рестораном. Администратор здесь не учитывается:
  // роль ADMIN лежит в токене, и проверяющая сторона видит её сама.
  rpc CheckRestaurantAccess(CheckRestaurantAccessRequest) returns (CheckRestaurantAccessResponse);

  // Назначить пользователя управляющим. Идемпотентно: повторное назначение — успех,
  // а не ошибка, иначе повтор вызова после таймаута падал бы на уже сделанной работе.
  // Неизвестный пользователь — NOT_FOUND.
  rpc AssignRestaurantManager(AssignRestaurantManagerRequest) returns (AssignRestaurantManagerResponse);
}

message CheckRestaurantAccessRequest {
  int64 user_id = 1;
  int64 restaurant_id = 2;
}

message CheckRestaurantAccessResponse {
  bool manages = 1;
}

message AssignRestaurantManagerRequest {
  int64 user_id = 1;
  int64 restaurant_id = 2;
}

message AssignRestaurantManagerResponse {
}
