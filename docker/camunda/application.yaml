# Camunda 8 (профиль bpm): Zeebe + Operate + Tasklist в одном процессе.
#
# Основа — облегчённая конфигурация из официального docker-compose 8.10 (camunda-distributions):
# вторичное хранилище H2 в файле, без Elasticsearch, Keycloak и коннекторов. Это режим для
# разработки: Camunda сама предупреждает, что H2 не для продакшена.
camunda:
  backup:
    webapps:
      enabled: false
  system:
    # Потоков по числу ядер ноутбука здесь не нужно: процессов единицы.
    cpu-thread-count: "2"
    io-thread-count: "2"
  security:
    authentication:
      method: "basic"
      # API без входа: order-service ходит к брокеру без учётных данных. Только для локального стека.
      unprotectedApi: true
    authorizations:
      enabled: false
    initialization:
      users:
        - username: "demo"
          password: "demo"
          name: "Demo User"
          email: "demo@demo.local"
      defaultRoles.admin.users:
        - "demo"
  data:
    secondary-storage:
      type: rdbms
      rdbms:
        # Рядом с данными брокера, в том же томе food_delivery_camunda_data.
        url: jdbc:h2:file:./data/h2db
        username: sa
        password:
        flushInterval: PT0.5S
        queueSize: 1000
