# MQTT для курьеров (телефон → брокер) и HTTP-бэкенд аутентификации.
#
# Встроенный бэкенд — первым: сервисные учётки (RABBITMQ_USER) проверяет сам брокер. Логины, которых он
# не знает (идентификаторы курьеров), уходят в tracking-service: пароль там — access-токен курьера, а
# писать разрешено только в его собственные топики couriers/<id>/... (см. RabbitHttpAuthController).
auth_backends.1 = internal
auth_backends.2 = http
auth_http.http_method = post
auth_http.user_path = http://tracking-service:8080/internal/rabbitmq/user
auth_http.vhost_path = http://tracking-service:8080/internal/rabbitmq/vhost
auth_http.resource_path = http://tracking-service:8080/internal/rabbitmq/resource
auth_http.topic_path = http://tracking-service:8080/internal/rabbitmq/topic

# Без анонимных подключений; сообщения MQTT попадают в amq.topic, "/" в топике становится "." в ключе.
mqtt.allow_anonymous = false
mqtt.vhost = /
mqtt.exchange = amq.topic
mqtt.listeners.tcp.default = 1883

# MQTT поверх WebSocket — для браузера (страница курьера); nginx веб-интерфейса проксирует /mqtt сюда.
web_mqtt.tcp.port = 15675
