# Веб-интерфейс «Вкусно»: раздаёт статику и проксирует API на шлюз, так что браузеру нужен один адрес
# (никакого CORS). Имена сервисов разрешаются при каждом запросе, поэтому nginx стартует, даже если
# шлюз или агент ещё не подняты.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Фото блюд до 2 МБ плюс служебные части multipart.
    client_max_body_size 4m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # REST API, фото блюд, открытые ключи и SOAP: всё это отдаёт шлюз.
    location ~ ^/(api|media|ws|\.well-known|graphql)(/|$) {
        set $gateway http://api-gateway:8080;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # MQTT поверх WebSocket (плагин rabbitmq_web_mqtt): страница курьера шлёт по нему точки GPS.
    location = /mqtt {
        set $mqtt http://rabbitmq:15675;
        proxy_pass $mqtt/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # ИИ-помощник (food_delivery_agent) запущен на этом компьютере, а не в Docker: Ollama работает на видеокарте.
    # Ответ языковой модели на холодном старте занимает до минуты, поэтому таймаут большой.
    location /agent/ {
        set $agent http://host.docker.internal:8001;
        rewrite ^/agent/(.*)$ /$1 break;
        proxy_pass $agent;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 200s;
    }

    # Проверка доступности инструментов для страницы «Инструменты»: браузер не может прочитать ответ чужого
    # порта (CORS), а nginx внутри сети compose может. Отвечает кодом инструмента; 502 - контейнер не запущен.
    location = /_status/gateway {
        set $probe http://api-gateway:8080/api/v1/restaurants;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/swagger {
        set $probe http://api-gateway:8080/swagger-ui.html;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/graphiql {
        set $probe http://api-gateway:8080/graphiql;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/wsdl {
        set $probe http://api-gateway:8080/ws/menu.wsdl;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/agent {
        set $probe http://host.docker.internal:8001/health;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/grafana {
        set $probe http://grafana:3000/api/health;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/prometheus {
        set $probe http://prometheus:9090/-/ready;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/mailpit {
        set $probe http://mailpit:8025/;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/kafka-ui {
        set $probe http://kafka-ui:8080/;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/rabbitmq {
        set $probe http://rabbitmq:15672/;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/minio {
        set $probe http://minio:9000/minio/health/live;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/keycloak {
        set $probe http://keycloak:8080/realms/food-delivery;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/kibana {
        set $probe http://kibana:5601/api/status;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/elasticsearch {
        set $probe http://elasticsearch:9200/;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/clickhouse {
        set $probe http://clickhouse:8123/ping;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }
    location = /_status/neo4j {
        set $probe http://neo4j:7474/;
        proxy_pass $probe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors off;
    }

    # Скрипты и стили без долгого кэша: интерфейс правится без сборки, изменения должны быть видны сразу.
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
