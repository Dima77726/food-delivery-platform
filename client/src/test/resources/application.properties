# Значения переменных окружения для контрактного теста клиента.
#
# Тест поднимает монолит, но со своим тестовым classpath: service/src/test/resources
# сюда не попадает. А у учётных данных в application.yml монолита значений по умолчанию нет,
# и без этого файла плейсхолдер ${JWT_SECRET} остался бы неразрешённым — Spring подставил
# бы саму строку, и приложение упало бы на «секрете короче 32 байт».
#
# Настоящих учётных данных здесь нет: адреса и пароли контейнеров подставляют Testcontainers.
JWT_SECRET=test-only-jwt-secret-not-used-outside-tests
POSTGRES_USER=test
POSTGRES_PASSWORD=test
